<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UzTube Web App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --text-color: #ffffff;
            --secondary-text: #aaa;
            --card-bg: #212121;
            --red-color: #ff0000;
        }
        body {
            font-family: Roboto, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding-bottom: 70px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background-color: var(--bg-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: bold;
            font-size: 20px;
        }
        .logo span {
            background-color: var(--red-color);
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
        }
        .header-icons {
            display: flex;
            gap: 20px;
            font-size: 20px;
            cursor: pointer;
        }
        .chips-container {
            display: flex;
            gap: 10px;
            padding: 10px 15px;
            overflow-x: auto;
            white-space: nowrap;
            background-color: var(--bg-color);
            scrollbar-width: none;
        }
        .chips-container::-webkit-scrollbar { display: none; }
        .chip {
            background-color: #272727;
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            border: none;
        }
        .chip.active {
            background-color: white;
            color: black;
        }
        /* Sahifalar */
        .page {
            display: none;
            padding: 15px;
        }
        .page.active {
            display: block;
        }
        .video-card {
            margin-bottom: 20px;
            background-color: var(--bg-color);
        }
        .thumbnail {
            width: 100%;
            height: 200px;
            background-color: #333;
            background-size: cover;
            background-position: center;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
        .video-details {
            display: flex;
            gap: 12px;
            padding: 12px 15px;
        }
        .channel-avatar {
            width: 36px;
            height: 36px;
            background-color: #555;
            border-radius: 50%;
        }
        .video-meta h3 {
            margin: 0 0 5px 0;
            font-size: 15px;
            line-height: 1.4;
        }
        .video-meta p {
            margin: 0;
            font-size: 13px;
            color: var(--secondary-text);
        }
        /* Yuklash formasi */
        .upload-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }
        .upload-form input, .upload-form button {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #212121;
            color: white;
            font-size: 15px;
        }
        .upload-form button {
            background-color: var(--red-color);
            font-weight: bold;
            cursor: pointer;
        }
        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: #121212;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #272727;
            z-index: 1000;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--secondary-text);
            font-size: 11px;
            cursor: pointer;
            text-decoration: none;
            background: none;
            border: none;
        }
        .nav-item.active {
            color: white;
        }
        .nav-item span {
            font-size: 20px;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <!-- YouTube Header -->
    <div class="header">
        <div class="logo">Uz<span>Tube</span></div>
        <div class="header-icons">
            <span onclick="alert('Qidiruv tez orada ishga tushadi!')">🔍</span>
            <span onclick="switchPage('profile')">👤</span>
        </div>
    </div>

    <!-- ASOSIY SAHIFA -->
    <div id="home-page" class="page active">
        <div class="chips-container">
            <button class="chip active">Barchasi</button>
            <button class="chip">O'yinlar</button>
            <button class="chip">Musiqa</button>
            <button class="chip">Futbol</button>
            <button class="chip">Shorts</button>
        </div>
        <div id="video-feed">
            <!-- Videolar shu yerga tushadi -->
        </div>
    </div>

    <!-- SHORTS SAHIFASI -->
    <div id="shorts-page" class="page">
        <h2>⚡ Shorts Qisqa Videolar</h2>
        <p style="color: #aaa;">Tez kunda qisqa videolar lentasi ishga tushadi!</p>
    </div>

    <!-- YUKLASH SAHIFASI -->
    <div id="upload-page" class="page">
        <h2>➕ Videoni Joylash</h2>
        <div class="upload-form">
            <input type="text" id="v-title" placeholder="Video sarlavhasi (Nomi)">
            <input type="text" id="v-channel" placeholder="Kanal nomingiz">
            <input type="text" id="v-link" placeholder="Video havolasi (YouTube / Telegram link)">
            <button onclick="uploadVideo()">Videoni Yuklash</button>
        </div>
    </div>

    <!-- OBUNALAR SAHIFASI -->
    <div id="subscriptions-page" class="page">
        <h2>🔔 Obunalar</h2>
        <p style="color: #aaa;">Siz obuna bo'lgan kanallar ro'shyati bo'sh.</p>
    </div>

    <!-- PROFIL SAHIFASI -->
    <div id="profile-page" class="page">
        <h2>👤 Foydalanuvchi Profili</h2>
        <p style="color: #aaa;">Xush kelibsiz! Bu yerda sizning yuklagan videolaringiz chiqadi.</p>
    </div>

    <!-- YouTube Bottom Navigation Bar -->
    <div class="bottom-nav">
        <button class="nav-item active" onclick="switchPage('home')">
            <span>🏠</span>Asosiy
        </button>
        <button class="nav-item" onclick="switchPage('shorts')">
            <span>⚡</span>Shorts
        </button>
        <button class="nav-item" onclick="switchPage('upload')">
            <span>➕</span>Yuklash
        </button>
        <button class="nav-item" onclick="switchPage('subscriptions')">
            <span>🔔</span>Obunalar
        </button>
        <button class="nav-item" onclick="switchPage('profile')">
            <span>👤</span>Siz
        </button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // Sahifalarni almashtirish funksiyasi
        function switchPage(pageName) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

            if (pageName === 'home') {
                document.getElementById('home-page').classList.add('active');
                event.currentTarget.classList.add('active');
            } else if (pageName === 'shorts') {
                document.getElementById('shorts-page').classList.add('active');
                event.currentTarget.classList.add('active');
            } else if (pageName === 'upload') {
                document.getElementById('upload-page').classList.add('active');
                event.currentTarget.classList.add('active');
            } else if (pageName === 'subscriptions') {
                document.getElementById('subscriptions-page').classList.add('active');
                event.currentTarget.classList.add('active');
            } else if (pageName === 'profile') {
                document.getElementById('profile-page').classList.add('active');
            }
        }

        // Boshlang'ich videolar bazasi
        let videos = [
            {title: "Telegramda Bot yaratish darsligi", channel: "Janob Shoxruz", views: "12K ko'rish", link: "#"},
            {title: "PUBG Mobile yangi mavsum", channel: "Gaming Uz", views: "45K ko'rish", link: "#"}
        ];

        function renderVideos() {
            let feed = document.getElementById('video-feed');
            feed.innerHTML = "";
            videos.forEach(v => {
                feed.innerHTML += `
                    <div class="video-card" onclick="window.open('${v.link}')">
                        <div class="thumbnail">▶ Tomosha qilish</div>
                        <div class="video-details">
                            <div class="channel-avatar"></div>
                            <div class="video-meta">
                                <h3>${v.title}</h3>
                                <p>${v.channel} • ${v.views} • Yangi</p>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function uploadVideo() {
            let title = document.getElementById('v-title').value;
            let channel = document.getElementById('v-channel').value;
            let link = document.getElementById('v-link').value;

            if(!title || !channel) {
                alert("Iltimos, video nomi va kanal nomini kiriting!");
                return;
            }

            videos.unshift({title: title, channel: channel, views: "1 ko'rish", link: link ? link : "#"});
            alert("Muvaffaqiyatli yuklandi!");
            document.getElementById('v-title').value = "";
            document.getElementById('v-channel').value = "";
            document.getElementById('v-link').value = "";
            
            switchPage('home');
            renderVideos();
        }

        renderVideos();
    </script>
</body>
</html>
