<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Exness Live Sim</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        html, body { width: 100%; height: 100%; overflow: hidden; background-color: #0c0e14; color: #a1a8b8; display: flex; flex-direction: column; }

        /* Yuqori qism / Header */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: #121621; border-bottom: 1px solid #1e2330; }
        .pair-badge { display: flex; align-items: center; gap: 6px; }
        .pair-title { font-size: 16px; font-weight: bold; color: #ffffff; }
        .sim-tag { background: #113822; color: #00e676; font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 3px; border: 1px solid #1b5e35; }
        
        .balance-container { text-align: right; }
        .balance-label { font-size: 10px; color: #5e6678; text-transform: uppercase; font-weight: bold; }
        .balance-val { font-size: 15px; font-weight: bold; color: #00e676; display: flex; align-items: center; justify-content: flex-end; gap: 4px; }
        .refresh-btn { cursor: pointer; font-size: 12px; color: #5e6678; }

        /* Kichik panel / Sub-Header */
        .sub-header { display: flex; justify-content: space-between; align-items: center; padding: 8px 14px; background: #0c0e14; font-size: 12px; font-weight: bold; }
        .timeframes span { margin-right: 12px; color: #5e6678; cursor: pointer; }
        .timeframes span.active { color: #2979ff; background: #18253f; padding: 2px 6px; border-radius: 3px; }
        
        .bid-ask-box { display: flex; gap: 12px; font-size: 11px; }
        .bid-val { color: #f44336; }
        .ask-val { color: #00e676; }

        /* Grafik zonasi */
        #chart-wrapper { flex: 1; width: 100%; position: relative; }
        #chart-container { width: 100%; height: 100%; }

        /* Foyda/Ziyon indikatori */
        .pnl-overlay { position: absolute; top: 12px; left: 12px; z-index: 10; background: rgba(18, 22, 33, 0.85); border: 1px solid #1e2330; border-radius: 4px; padding: 6px 12px; font-size: 13px; font-weight: bold; color: #00e676; }

        /* Boshqaruv paneli */
        .controls { background: #121621; border-top: 1px solid #1e2330; padding: 10px 14px; }
        .inputs-row { display: flex; gap: 8px; margin-bottom: 10px; }
        .input-item { flex: 1; background: #1a202c; border: 1px solid #2d3748; border-radius: 4px; padding: 6px 8px; display: flex; justify-content: space-between; align-items: center; }
        .input-label { font-size: 11px; color: #718096; }
        .input-val { width: 45px; background: transparent; border: none; color: #fff; text-align: right; font-weight: bold; font-size: 13px; outline: none; }

        .action-btns { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 13px; border: none; border-radius: 6px; font-weight: bold; font-size: 15px; color: #ffffff; cursor: pointer; }
        .btn-sell { background: #e53935; }
        .btn-buy { background: #00c853; }
        .btn:active { opacity: 0.85; transform: scale(0.98); }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="pair-badge">
            <span class="pair-title">EUR/USD</span>
            <span class="sim-tag">LIVE SIM</span>
        </div>
        <div class="balance-container">
            <div class="balance-label">DEMO BALANS</div>
            <div class="balance-val">$<span id="balance">10,000.00</span> <span class="refresh-btn" onclick="resetBalance()">↺</span></div>
        </div>
    </div>

    <!-- Taymfreym va Narxlar -->
    <div class="sub-header">
        <div class="timeframes">
            <span class="active">M1</span>
            <span>M5</span>
            <span>M15</span>
        </div>
        <div class="bid-ask-box">
            <div>SELL (BID) <span class="bid-val" id="sub-bid">1.08694</span></div>
            <div>BUY (ASK) <span class="ask-val" id="sub-ask">1.08696</span></div>
        </div>
    </div>

    <!-- Grafik -->
    <div id="chart-wrapper">
        <div class="pnl-overlay" id="floating-pnl">Floating PnL: +$0.00</div>
        <div id="chart-container"></div>
    </div>

    <!-- Boshqaruv tugmalari -->
    <div class="controls">
        <div class="inputs-row">
            <div class="input-item">
                <span class="input-label">Lot:</span>
                <input type="number" id="lot-size" class="input-val" value="0.10" step="0.01" min="0.01">
            </div>
            <div class="input-item">
                <span class="input-label">TP (pips):</span>
                <input type="text" class="input-val" value="Off" disabled style="color:#718096;">
            </div>
            <div class="input-item">
                <span class="input-label">SL (pips):</span>
                <input type="text" class="input-val" value="Off" disabled style="color:#718096;">
            </div>
        </div>
        <div class="action-btns">
            <button class="btn btn-sell" onclick="executeTrade('SELL')">SELL</button>
            <button class="btn btn-buy" onclick="executeTrade('BUY')">BUY</button>
        </div>
    </div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        let balance = 10000.00;
        let currentPrice = 1.08694;
        let spread = 0.00002;
        let activeOrders = [];
        let trend = 0; 

        const wrapper = document.getElementById('chart-wrapper');
        const container = document.getElementById('chart-container');

        const chart = LightweightCharts.createChart(container, {
            width: wrapper.clientWidth,
            height: wrapper.clientHeight,
            layout: { backgroundColor: '#0c0e14', textColor: '#5e6678' },
            grid: { vertLines: { color: '#161a24' }, horzLines: { color: '#161a24' } },
            timeScale: { timeVisible: true, secondsVisible: true }
        });

        const candleSeries = chart.addCandlestickSeries({
            upColor: '#00c853', downColor: '#e53935',
            borderUpColor: '#00c853', borderDownColor: '#e53935',
            wickUpColor: '#00c853', wickDownColor: '#e53935'
        });

        new ResizeObserver(entries => {
            if (entries[0]) {
                const { width, height } = entries[0].contentRect;
                chart.applyOptions({ width, height });
            }
        }).observe(wrapper);

        let currentTime = Math.floor(Date.now() / 1000) - 300;
        let chartData = [];
        for (let i = 0; i < 60; i++) {
            let open = currentPrice;
            let close = open + (Math.random() - 0.49) * 0.00015;
            let high = Math.max(open, close) + Math.random() * 0.00008;
            let low = Math.min(open, close) - Math.random() * 0.00008;
            chartData.push({ time: currentTime + (i * 5), open, high, low, close });
            currentPrice = close;
        }
        candleSeries.setData(chartData);

        // Jonli shamchalar tebranishi (har 0.5 soniyada)
        setInterval(() => {
            currentTime += 1;
            let open = currentPrice;

            if (Math.random() < 0.1) trend = (Math.random() - 0.5) * 0.0001; 
            let noise = (Math.random() - 0.5) * 0.00008;
            
            let close = open + trend + noise;
            let high = Math.max(open, close) + Math.random() * 0.00004;
            let low = Math.min(open, close) - Math.random() * 0.00004;

            candleSeries.update({ time: currentTime, open, high, low, close });
            currentPrice = close;

            let bid = currentPrice.toFixed(5);
            let ask = (currentPrice + spread).toFixed(5);
            document.getElementById('sub-bid').innerText = bid;
            document.getElementById('sub-ask').innerText = ask;

            updateFloatingPnL();
        }, 500);

        function executeTrade(type) {
            let lotInput = parseFloat(document.getElementById('lot-size').value);
            if (isNaN(lotInput) || lotInput <= 0) return;

            let margin = lotInput * 1000;
            if (margin > balance) {
                alert("Balansda yetarli mablag' yo'q!");
                return;
            }

            balance -= margin;
            updateBalanceUI();

            let entryPrice = type === 'BUY' ? currentPrice + spread : currentPrice;

            activeOrders.push({
                id: Date.now(),
                type: type,
                lot: lotInput,
                margin: margin,
                entryPrice: entryPrice
            });
        }

        function updateFloatingPnL() {
            if (activeOrders.length === 0) {
                document.getElementById('floating-pnl').innerText = `Floating PnL: +$0.00`;
                document.getElementById('floating-pnl').style.color = '#00e676';
                return;
            }

            let totalPnL = 0;
            activeOrders.forEach(order => {
                let diff = order.type === 'BUY' ? (currentPrice - order.entryPrice) : (order.entryPrice - currentPrice);
                let pnl = (diff * 100000) * order.lot;
                totalPnL += pnl;
            });

            let pnlElement = document.getElementById('floating-pnl');
            let sign = totalPnL >= 0 ? '+' : '';
            pnlElement.innerText = `Floating PnL: ${sign}$${totalPnL.toFixed(2)}`;
            pnlElement.style.color = totalPnL >= 0 ? '#00e676' : '#e53935';
        }

        function updateBalanceUI() {
            document.getElementById('balance').innerText = balance.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function resetBalance() {
            balance = 10000.00;
            activeOrders = [];
            updateBalanceUI();
            updateFloatingPnL();
        }
    </script>
</body>
</html>
