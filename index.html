<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>TONIX Clicker</title>
    <style>
        body { background: #0f172a; color: white; text-align: center; padding-top: 100px; font-family: sans-serif; }
        .circle { width: 200px; height: 200px; background: #38bdf8; border-radius: 50%; margin: 20px auto; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Tangalar: <span id="score">0</span></h1>
    <div class="circle" onclick="add()">BOSING</div>
    <script>
        let s = 0;
        function add() { s++; document.getElementById("score").innerText = s; }
    </script>
</body>
</html>
