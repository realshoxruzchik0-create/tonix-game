<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Exness TradingView Pro Terminal</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        html, body { width: 100%; height: 100%; overflow: hidden; background-color: #0b0e14; color: #d1d4dc; display: flex; flex-direction: column; }
        
        .top-nav { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: #151a21; border-bottom: 1px solid #2a2e39; }
        .symbol-title { font-weight: bold; font-size: 15px; color: #2979ff; }
        .balance-box { text-align: right; }
        .balance-label { font-size: 10px; color: #787b86; text-transform: uppercase; }
        .balance-value { font-size: 15px; font-weight: bold; color: #00e676; }

        .tools-bar { display: flex; justify-content: space-between; padding: 6px 12px; background: #11151c; border-bottom: 1px solid #1e222d; font-size: 12px; }
        .tf-buttons span { margin-right: 12px; color: #787b86; font-weight: 600; cursor: pointer; }
        .tf-buttons span.active { color: #2979ff; }
        .spread-info { color: #ff9800; font-weight: bold; }

        /* Chart joylashuvi aniq balandlik bilan */
        #chart-wrapper { flex: 1; width: 100%; position: relative; min-height: 250px; }
        #chart-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }

        .control-panel { background: #151a21; border-top: 1px solid #2a2e39; padding: 10px 14px; }
        .input-group { display: flex; gap: 8px; margin-bottom: 8px; }
        .input-box { flex: 1; display: flex; flex-direction: column; }
        .input-box label { font-size: 10px; color: #787b86; margin-bottom: 2px; }
        .input-box input { background: #0b0e14; border: 1px solid #2a2e39; color: #fff; padding: 6px 8px; border-radius: 4px; font-size: 13px; text-align: center; outline: none; }

        .trade-buttons { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; font-size: 14px; color: #fff; cursor: pointer; }
        .btn-buy { background: #089981; }
        .btn-sell { background: #f23645; }

        .positions-panel { max-height: 100px; overflow-y: auto; background: #0b0e14; border-top: 1px solid #1e222d; padding: 4px; }
        .pos-card { display: flex; justify-content: space-between; align-items: center; background: #151a21; padding: 6px 10px; border-radius: 4px; margin-bottom: 4px; font-size: 12px; }
        .pos-type.BUY { color: #089981; font-weight: bold; }
        .pos-type.SELL { color: #f23645; font-weight: bold; }
        .close-btn { background: #2a2e39; color: #fff; border: none; padding: 3px 8px; border-radius: 3px; font-size: 11px; }
    </style>
</head>
<body>

    <div class="top-nav">
        <span class="symbol-title">EUR/USD Pro</span>
        <div class="balance-box">
            <div class="balance-label">Balans</div>
            <div class="balance-value">$<span id="balance">200.00</span></div>
        </div>
    </div>

    <div class="tools-bar">
        <div class="tf-buttons">
            <span class="active">M1</span>
            <span>M5</span>
            <span>M15</span>
        </div>
        <div class="spread-info">Spred: 1.5 pips</div>
    </div>

    <div id="chart-wrapper">
        <div id="chart-container"></div>
    </div>

    <div class="positions-panel" id="positions-container"></div>

    <div class="control-panel">
        <div class="input-group">
            <div class="input-box">
                <label>Tikiladigan Summa ($)</label>
                <input type="number" id="trade-amount" value="50" min="10">
            </div>
            <div class="input-box">
                <label>Kredit Yelkasi</label>
                <input type="text" value="1:100" disabled style="color: #787b86;">
            </div>
        </div>
        <div class="trade-buttons">
            <button class="btn btn-buy" onclick="openOrder('BUY')">BUY ▲</button>
            <button class="btn btn-sell" onclick="openOrder('SELL')">SELL ▼</button>
        </div>
    </div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        let userBalance = 200.00;
        let currentPrice = 1.08500;
        let spread = 0.00015;
        let activeOrders = [];

        const wrapper = document.getElementById('chart-wrapper');
        const container = document.getElementById('chart-container');

        // Chartni yaratish
        const chart = LightweightCharts.createChart(container, {
            width: wrapper.clientWidth,
            height: wrapper.clientHeight,
            layout: { backgroundColor: '#0b0e14', textColor: '#787b86' },
            grid: { vertLines: { color: '#1e222d' }, horzLines: { color: '#1e222d' } },
            timeScale: { timeVisible: true, secondsVisible: true }
        });

        const candleSeries = chart.addCandlestickSeries({
            upColor: '#089981', downColor: '#f23645',
            borderUpColor: '#089981', borderDownColor: '#f23645',
            wickUpColor: '#089981', wickDownColor: '#f23645'
        });

        // O'lcham o'zgarganda chartni qayta o'lchash (Telegram WebApp uchun shart)
        new ResizeObserver(entries => {
            if (entries[0]) {
                const { width, height } = entries[0].contentRect;
                chart.applyOptions({ width, height });
            }
        }).observe(wrapper);

        // Boshlang'ich shamlar
        let currentTime = Math.floor(Date.now() / 1000) - 300;
        let chartData = [];
        for (let i = 0; i < 60; i++) {
            let open = currentPrice;
            let close = open + (Math.random() - 0.505) * 0.00030;
            let high = Math.max(open, close) + Math.random() * 0.00015;
            let low = Math.min(open, close) - Math.random() * 0.00015;
            chartData.push({ time: currentTime + (i * 5), open, high, low, close });
            currentPrice = close;
        }
        candleSeries.setData(chartData);

        // Real-time harakat
        setInterval(() => {
            currentTime += 1;
            let open = currentPrice;
            let close = open + (Math.random() - 0.51) * 0.00012;
            let high = Math.max(open, close) + Math.random() * 0.00006;
            let low = Math.min(open, close) - Math.random() * 0.00006;

            candleSeries.update({ time: currentTime, open, high, low, close });
            currentPrice = close;
            updatePositions();
        }, 800);

        function openOrder(type) {
            const amountInput = document.getElementById('trade-amount');
            const amount = parseFloat(amountInput.value);

            if (isNaN(amount) || amount <= 0 || amount > userBalance) {
                alert("Mablag' yetarli emas yoki xato summa!");
                return;
            }

            userBalance -= amount;
            document.getElementById('balance').innerText = userBalance.toFixed(2);

            let entryPrice = type === 'BUY' ? currentPrice + spread : currentPrice - spread;

            activeOrders.push({
                id: Date.now(),
                type: type,
                amount: amount,
                entryPrice: entryPrice,
                pnl: 0
            });
            renderPositions();
        }

        function updatePositions() {
            let container = document.getElementById('positions-container');
            if (activeOrders.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:#787b86; font-size:11px; padding:6px;">Ochiq pozitsiyalar yo\'q</div>';
                return;
            }

            let html = '';
            activeOrders.forEach(order => {
                let priceDiff = order.type === 'BUY' ? (currentPrice - order.entryPrice) : (order.entryPrice - currentPrice);
                order.pnl = (priceDiff * 10000) * (order.amount / 10);
                let pnlColor = order.pnl >= 0 ? '#089981' : '#f23645';

                html += `
                    <div class="pos-card">
                        <div><span class="pos-type ${order.type}">${order.type}</span> $${order.amount}</div>
                        <div>Kirish: ${order.entryPrice.toFixed(5)}</div>
                        <div style="color:${pnlColor}; font-weight:bold;">$${order.pnl.toFixed(2)}</div>
                        <button class="close-btn" onclick="closeOrder(${order.id})">Yopish</button>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function renderPositions() { updatePositions(); }

        function closeOrder(id) {
            let index = activeOrders.findIndex(o => o.id === id);
            if (index !== -1) {
                let order = activeOrders[index];
                let returnAmount = order.amount + order.pnl;
                if (returnAmount < 0) returnAmount = 0;

                userBalance += returnAmount;
                document.getElementById('balance').innerText = userBalance.toFixed(2);

                activeOrders.splice(index, 1);
                renderPositions();
            }
        }
    </script>
</body>
</html>
