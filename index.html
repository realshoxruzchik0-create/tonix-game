<html lang="uz">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UZUZ.BET</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 2px solid #1e293b;
        }
        header h1 {
            color: #38bdf8;
            font-size: 28px;
            margin-bottom: 5px;
        }
        header p {
            color: #94a3b8;
            font-size: 14px;
        }
        .balance-card {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid #334155;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        .balance-card h3 {
            color: #94a3b8;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .balance-card .amount {
            font-size: 32px;
            font-weight: bold;
            color: #22c55e;
            margin-top: 10px;
        }
        .games-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .game-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .game-card:active {
            transform: scale(0.95);
            background-color: #334155;
        }
        .game-card .icon {
            font-size: 30px;
            margin-bottom: 10px;
        }
        .game-card h4 {
            font-size: 16px;
            color: #f8fafc;
        }
