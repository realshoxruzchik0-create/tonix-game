<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UzWinBetBot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #064e3b; /* To'q yashil fon */
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        
        #pin-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 360px;
            padding: 20px;
        }

        .brand-title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 40px;
            letter-spacing: 1px;
            color: #34d399;
        }

        .instruction {
            font-size: 15px;
            color: #d1fae5;
            margin-bottom: 25px;
            text-align: center;
        }

        .dots-container {
            display: flex;
            gap: 12px;
            margin-bottom: 40px;
        }

        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background-color: #047857;
            border: 2px solid #10b981;
            transition: 0.2s;
        }

        .dot.active {
            background-color: #34d399;
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            width: 100%;
            max-width: 280px;
        }

        .key {
            background-color: rgba(6, 78, 59, 0.8);
            border: 1px solid rgba(52, 211, 153, 0.2);
            color: #ffffff;
            font-size: 24px;
            font-weight: 500;
            height: 65px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.1s, transform 0.1s;
        }

        .key:active {
            background-color: #047857;
            transform: scale(0.92);
        }

        .footer-links {
            margin-top: 35px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-size: 14px;
            color: #6ee7b7;
        }

        .footer-links span {
            cursor: pointer;
        }

        #game-screen {
            display: none;
            text-align: center;
            width: 100%;
            max-width: 380px;
            padding: 20px;
            background: #022c22;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #059669;
        }

        .balance-box {
            font-size: 18px;
            background: #064e3b;
            padding: 12px;
            border-radius: 10px;
            margin: 15px 0;
            border: 1px solid #10b981;
        }

        .slot-machine {
            font-size: 35px;
            background: #022c22;
            border: 2px solid #34d399;
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
            letter-spacing: 10px;
        }

        .play-btn {
            background-color: #34d399;
            color: #022c22;
            border: none;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        
        .play-btn:active { transform: scale(0.96); }
    </style>
</head>
<body>

    <div id="pin-screen">
        <div class="brand-title">UzWinBetBot 🦎</div>
        <div class="instruction">Davom etish uchun PIN kodni kiriting</div>
        
        <div class="dots-container">
            <div class="dot" id="d1"></div>
            <div class="dot" id="d2"></div>
            <div class="dot" id="d3"></div>
            <div class="dot" id="d4"></div>
        </div>

        <div class="keypad">
            <div class="key" onclick="pressKey('1')">1</div>
            <div class="key" onclick="pressKey('2')">2</div>
            <div class="key" onclick="pressKey('3')">3</div>
            <div class="key" onclick="pressKey('4')">4</div>
            <div class="key" onclick="pressKey('5')">5</div>
            <div class="key" onclick="pressKey('6')">6</div>
            <div class="key" onclick="pressKey('7')">7</div>
            <div class="key" onclick="pressKey('8')">8</div>
            <div class="key" onclick="pressKey('9')">9</div>
            <div></div>
            <div class="key" onclick="pressKey('0')">0</div>
            <div class="key" onclick="deleteKey()">⌫</div>
        </div>

        <div class="footer-links">
            <span onclick="alert('PIN kodni eslab qoling yoki ixtiyoriy 4 ta raqam tering!')">PIN kodni tashlab ketish: 10 daqiqa</span>
            <span onclick="alert('Bu shunchaki koʻngilochar bot!')">PIN kodni unutdingizmi?</span>
        </div>
    </div>

    <div id="game-screen">
        <h2 style="color: #34d399; margin-top: 0;">UzWinBetBot 🦎</h2>
        <p>Xush kelibsiz, omadli o'yinchi!</p>
        
        <div class="balance-box">Balans: <span id="balance">1000</span> ball</div>
        
        <div class="slot-machine" id="slots">🍒 🍋 🍊</div>
        
        <button class="play-btn" onclick="spinSlot()">AYLANTIRISH (-100)</button>
        <div id="game-msg" style="margin-top: 15px; font-size: 15px; min-height: 25px;"></div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let enteredPin = "";

        function pressKey(num) {
            if (enteredPin.length < 4) {
                enteredPin += num;
                updateDots();
                if (enteredPin.length === 4) {
                    setTimeout(checkPin, 200);
                }
            }
        }

        function deleteKey() {
            if (enteredPin.length > 0) {
                enteredPin = enteredPin.slice(0, -1);
                updateDots();
            }
        }

        function updateDots() {
            for (let i = 1; i <= 4; i++) {
                let dot = document.getElementById(`d${i}`);
                if (i <= enteredPin.length) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            }
        }

        function checkPin() {
            document.getElementById('pin-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            tg.HapticFeedback.notificationOccurred('success');
        }

        let balance = 1000;
        const symbols = ['🍒', '🍋', '🍊', '🍇', '💎', ' 7️⃣ '];

        function spinSlot() {
            let msg = document.getElementById('game-msg');
            if (balance < 100) {
                msg.style.color = "#f87171";
                msg.innerText = "Balansingiz tugadi! 😢";
                return;
            }

            balance -= 100;
            let s1 = symbols[Math.floor(Math.random() * symbols.length)];
            let s2 = symbols[Math.floor(Math.random() * symbols.length)];
            let s3 = symbols[Math.floor(Math.random() * symbols.length)];

            document.getElementById('slots').innerText = `${s1} ${s2} ${s3}`;

            if (s1 === s2 && s2 === s3) {
                balance += 500;
                msg.style.color = "#34d399";
                msg.innerText = "🎉 Buxpot! +500 ball yutdingiz!";
                tg.HapticFeedback.notificationOccurred('success');
            } else if (s1 === s2 || s2 === s3 || s1 === s3) {
                balance += 150;
                msg.style.color = "#6ee7b7";
                msg.innerText = "✨ Yaxshi, +150 ball!";
                tg.HapticFeedback.impactOccurred('medium');
            } else {
                msg.style.color = "#9ca3af";
                msg.innerText = "Yutqazdingiz, yana urinib ko'ring!";
                tg.HapticFeedback.impactOccurred('light');
            }
            document.getElementById('balance').innerText = balance;
        }
    </script>
</body>
</html>
