<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Crypto Tap Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #000;
            background-image: radial-gradient(circle, #051c0d 0%, #000000 100%);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
        }
        .header {
            text-align: center;
            padding-top: 25px;
        }
        .balance-container {
            font-size: 42px;
            font-weight: bold;
            color: #00ff66;
            text-shadow: 0 0 15px rgba(0, 255, 102, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .level {
            font-size: 14px;
            color: #888;
            margin-top: 5px;
            letter-spacing: 1px;
        }
        .coin-section {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .coin {
            width: 250px;
            height: 250px;
            cursor: pointer;
            transition: transform 0.05s ease;
            filter: drop-shadow(0 0 25px rgba(0, 255, 102, 0.4));
        }
        .coin:active {
            transform: scale(0.90);
        }
        .floating-text {
            position: absolute;
            font-size: 32px;
            font-weight: bold;
            color: #ffcc00;
            text-shadow: 0 0 10px #ff0000;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.8); }
            100% { opacity: 0; transform: translateY(-120px) scale(1.3); }
        }
        .footer-section {
            width: 100%;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: linear-gradient(to top, rgba(0,0,0,0.95), transparent);
        }
        .energy-bar-container {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #aaa;
            padding: 0 10px;
        }
        .energy-bar {
            width: 100%;
            height: 12px;
            background: #111;
            border-radius: 6px;
            border: 1px solid #00ff66;
            overflow: hidden;
            position: relative;
        }
        .energy-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #00cc52, #00ff66);
            box-shadow: 0 0 10px #00ff66;
            transition: width 0.2s linear;
        }
        .nav-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(10, 20, 10, 0.85);
            border: 1px solid rgba(0, 255, 102, 0.2);
            border-radius: 16px;
            padding: 10px 0;
            backdrop-filter: blur(10px);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #888;
            font-size: 11px;
            cursor: pointer;
            transition: color 0.2s;
        }
        .nav-item:hover, .nav-item.active {
            color: #00ff66;
        }
        .nav-item span {
            font-size: 18px;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="balance-container">
            <span id="score">0</span>
        </div>
        <div class="level" id="levelText">LEVEL: +1 PER TAP</div>
    </div>

    <div class="coin-section" id="coinSection">
        <!-- O'zingizning shaffof tanga rasmingiz havolasini shu yerga qo'yasiz -->
        <img src="https://i.imgur.com/3V28sV3.png" alt="Coin" class="coin" id="coin">
    </div>

    <div class="footer-section">
        <div class="energy-bar-container">
            <span>⚡ <span id="energy">1000</span> / 1000</span>
            <span>Energy</span>
        </div>
        <div class="energy-bar">
            <div class="energy-fill" id="energyFill"></div>
        </div>

        <div class="nav-bar">
            <div class="nav-item active"><span>🚀</span>Boost</div>
            <div class="nav-item"><span>👥</span>Friends</div>
            <div class="nav-item"><span>📋</span>Tasks</div>
            <div class="nav-item"><span>💎</span>Airdrop</div>
        </div>
    </div>

    <script>
        // Xotiradan (localStorage) saqlangan tangalarni o'qib olish, bo'lmasa 0 dan boshlash
        let score = parseInt(localStorage.getItem('game_score')) || 0;
        let energy = parseInt(localStorage.getItem('game_energy')) || 1000;
        const maxEnergy = 1000;

        const scoreEl = document.getElementById('score');
        const energyEl = document.getElementById('energy');
        const energyFill = document.getElementById('energyFill');
        const coinSection = document.getElementById('coinSection');
        const coin = document.getElementById('coin');
        const levelText = document.getElementById('levelText');

        // Boshlang'ich qiymatni ekranga chiqarish
        scoreEl.textContent = score;
        energyEl.textContent = energy;
        updateEnergyBar();

        // Har bir bosishdagi tangani aniqlash funksiyasi
        function getClickPower() {
            if (score >= 6000) {
                levelText.textContent = "MAX LEVEL: +12 PER TAP";
                return 12;
            } else if (score >= 100) {
                levelText.textContent = "LEVEL: +5 PER TAP";
                return 5;
            } else {
                levelText.textContent = "LEVEL: +1 PER TAP";
                return 1;
            }
        }

        // Tanga bosilganda
        coin.addEventListener('click', (e) => {
            let clickPower = getClickPower();

            if (energy >= clickPower) {
                score += clickPower;
                energy -= clickPower;
                
                scoreEl.textContent = score;
                energyEl.textContent = energy;
                updateEnergyBar();

                // Ma'lumotlarni telefonda/brauzerda saqlab qolish (chiqib ketsa ham turadi)
                localStorage.setItem('game_score', score);
                localStorage.setItem('game_energy', energy);

                // Uchqun effektining chiqish joyi
                const rect = coin.getBoundingClientRect();
                const x = e.clientX - rect.left - 50;
                const y = e.clientY - rect.top - 50;

                createClickEffect(x, y, clickPower);
            }
        });

        // Sensor/Mobil ekranlar uchun ham (Tap-tap tez bosganda qotib qolmasligi uchun)
        coin.addEventListener('touchstart', (e) => {
            e.preventDefault();
            let touch = e.touches[0];
            let clickPower = getClickPower();

            if (energy >= clickPower) {
                score += clickPower;
                energy -= clickPower;
                
                scoreEl.textContent = score;
                energyEl.textContent = energy;
                updateEnergyBar();

                localStorage.setItem('game_score', score);
                localStorage.setItem('game_energy', energy);

                const rect = coin.getBoundingClientRect();
                const x = touch.clientX - rect.left - 50;
                const y = touch.clientY - rect.top - 50;

                createClickEffect(x, y, clickPower);
            }
        }, { passive: false });

        // Uchqun animatsiyasini yaratish (Siz yoqtirgan sariq-qizil effekt)
        function createClickEffect(x, y, power) {
            const effect = document.createElement('div');
            effect.className = 'floating-text';
            effect.textContent = `+${power}`;
            effect.style.left = `${x + 60}px`;
            effect.style.top = `${y + 40}px`;
            
            coinSection.appendChild(effect);

            setTimeout(() => {
                effect.remove();
            }, 800);
        }

        // Energiyani o'z-o'zidan tiklanishi
        setInterval(() => {
            if (energy < maxEnergy) {
                energy = Math.min(maxEnergy, energy + 3);
                energyEl.textContent = energy;
                localStorage.setItem('game_energy', energy);
                updateEnergyBar();
            }
        }, 1000);

        function updateEnergyBar() {
            const percentage = (energy / maxEnergy) * 100;
            energyFill.style.width = `${percentage}%`;
        }

        // Telegram WebApp kengayishi
        let tg = window.Telegram.WebApp;
        tg.expand();
    </script>
</body>
</html>
