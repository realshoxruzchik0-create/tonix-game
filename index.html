<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Hamster TON Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #0f0f1a; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        .score-board { font-size: 40px; font-weight: bold; color: #00d2ff; margin: 20px 0; }
        .coin-border { width: 220px; height: 220px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: 0.5s; cursor: pointer; border: 8px solid #fff; box-shadow: 0 0 40px rgba(255,255,255,0.2); }
        .hamster-img { width: 180px; height: 180px; border-radius: 50%; object-fit: cover; }
        .info-panel { background: #1e1e2f; padding: 15px; border-radius: 12px; margin-top: 20px; width: 100%; max-width: 400px; font-size: 13px; }
        .action-btn { background: #f39c12; border: none; padding: 15px; width: 100%; color: white; border-radius: 10px; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="score-board"><span id="score">0.00000</span> TON</div>

    <div class="coin-border" id="coinBorder" onclick="tap()">
        <img src="https://images.unsplash.com/photo-1548767797-d8c844163c4c?w=400&auto=format&fit=crop&q=80" class="hamster-img">
    </div>

    <div class="info-panel">
        <b>Ranglar qo'llanmasi:</b><br>
        • 0+ : Silver | 1k+ : Oltin | 1.5k+ : Suyuq Yaltiroq | 2k+ : Yorug' Oq<br>
        • <b>Mega Mukofot:</b> 1,000,000 (10 TON) yig'sangiz, Rang-barang rang beriladi + 5 TON bonus!
    </div>

    <button class="action-btn" onclick="alert('So\'rov yuborildi!')">TON Yechib Olish</button>

    <script>
        let score = parseFloat(localStorage.getItem('hamster_score') || 0);
        updateUI();

        function tap() {
            score += 0.00001; 
            localStorage.setItem('hamster_score', score.toFixed(5));
            updateUI();
        }

        function updateUI() {
            document.getElementById('score').innerText = score.toFixed(5);
            let b = document.getElementById('coinBorder');
            
            if (score >= 10.0) { // 1 mln ball 10 TON ga teng deb olindi
                b.style.background = 'linear-gradient(45deg, red, yellow, green, blue)';
            } else if (score >= 0.02000) { // 2k
                b.style.background = '#ffffff';
            } else if (score >= 0.01500) { // 1.5k
                b.style.background = '#00d2ff';
            } else if (score >= 0.01000) { // 1k
                b.style.background = '#ffd700';
            } else {
                b.style.background = '#bdc3c7'; // Silver
            }
        }
    </script>
</body>
</html>
