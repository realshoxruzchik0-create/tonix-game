<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectronicUzWallet - Ro'yxatdan o'tish</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
            color: #102a43;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        .app-container {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            padding: 24px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }
        .header-icon {
            text-align: center;
            font-size: 40px;
            margin-bottom: 15px;
        }
        .title {
            font-size: 22px;
            font-weight: 700;
            color: #0b69a3;
            margin-bottom: 20px;
            text-align: center;
        }
        .btn-card {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 16px 20px;
            margin-bottom: 12px;
            background: #f8fafc;
            border: 2px solid #e1ecf4;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            color: #243b53;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }
        .btn-card:active {
            transform: scale(0.98);
            background: #ebf8ff;
            border-color: #3182ce;
        }
        .btn-card span {
            font-size: 22px;
            margin-right: 15px;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #627d98;
        }
        .footer a {
            color: #0b69a3;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header-icon">🎲⚡</div>
        <div class="title">Ro'yxatdan o'tish</div>
        
        <button class="btn-card" onclick="alert('Bir bosishda ro\'yxatdan o\'tish tanlandi!')">
            <span>⚡</span> Bir bosishda
        </button>
        <button class="btn-card" onclick="alert('Telefon raqam orqali tanlandi!')">
            <span>📱</span> Telefon orqali
        </button>
        <button class="btn-card" onclick="alert('E-mail orqali tanlandi!')">
            <span>✉️</span> E-mail orqali
        </button>
        <button class="btn-card" onclick="alert('Ijtimoiy tarmoqlar tanlandi!')">
            <span>🌐</span> Ijtimoiy tarmoqlar orqali
        </button>

        <div class="footer">
            Akkauntingiz bormi? <a href="#" onclick="alert('Kirish sahifasi')">Kirish</a>
        </div>
    </div>

</body>
</html>
