<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hamster Kombat Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: linear-gradient(135deg, #1a1a2e, #16213e); color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; font-family: sans-serif; }
        .container { width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; }
        .nav-tabs { display: flex; justify-content: space-around; width: 100%; background: rgba(255, 255, 255, 0.05); border-radius: 12px; padding: 8px; margin-bottom: 20px; }
        .nav-btn { background: none; border: none; color: #aaa; font-weight: bold; cursor: pointer; padding: 8px; border-radius: 8px; }
        .nav-btn.active { background: #f39c12; color: #fff; }
        .page { display: none; width: 100%; flex-direction: column; align-items: center; }
        .page.active { display: flex; }
        .score-board { font-size: 32px; font-weight: bold; margin: 15px 0; color: #f39c12; }
        .hamster-container { margin: 30px 0; cursor: pointer; transition: transform 0.1s; }
        .hamster-img { width: 220px; height: 220px; border-radius: 50%; border: 4px solid #f39c12; box-shadow: 0 0 25px rgba(243, 156, 18, 0.5); }
        .action-btn { background: #f39c12; color: white; border: none; padding: 12px; width: 100%; font-weight: bold; border-radius: 8px; margin-top: 10px; }
        .footer-sponsor { margin-top: 40px; font-size: 14px; color: #888; text-align: center; }
        .footer-sponsor span { color: #f39c12; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <div class="nav-tabs">
            <button class="nav-btn active" onclick="switchPage('game')">O'yin</button>
            <button class="nav-btn" onclick="switchPage('withdraw')">Yechish</button>
            <button class="nav-btn" onclick="switchPage('ai')">AI</button>
        </div>

        <div id="game-page" class="page active">
            <div class="score-board">🪙 <span id="score">0</span></div>
            <div class="hamster-container" onclick="tapHamster()">
                <!-- O'zing yuborgan rasm havola qilib qo'yildi -->
                <img src="https://i.ibb.co/L15xG7m/hamster.jpg" alt="Hamster" class="hamster-img">
            </div>
        </div>

        <div id="withdraw-page" class="page">
            <h3>TON Yechib Olish</h3>
            <input type="text" id="ton-address" placeholder="TON hamyon manzili..." style="width: 100%; padding: 10px; margin: 10px 0;">
            <input type="number" id="ton-amount" placeholder="Miqdori (5 - 100 TON)" style="width: 100%; padding: 10px;">
            <button class="action-btn" onclick="requestWithdraw()">Yechib olish</button>
        </div>

        <div id="ai-page" class="page">
            <h3>Maxsus AI</h3>
            <div id="chat" style="width: 100%; height: 150px; background: #0004; padding: 10px; border-radius: 8px; margin: 10px 0;">AI: Savol bering!</div>
            <input type="text" id="ai-input" placeholder="Xabar..." style="width: 100%; padding: 10px;">
            <button class="action-btn" onclick="askAI()">Yuborish</button>
        </div>

        <div class="footer-sponsor">
            Qo'llab-quvvatlovchisi: <span>@Shoxruz_Support</span>
        </div>
    </div>

    <script>
        let score = parseInt(localStorage.getItem('hamster_score') || 0);
        document.getElementById('score').innerText = score;
        
        function switchPage(p) {
            document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
            document.getElementById(p + '-page').classList.add('active');
        }
        
        function tapHamster() {
            score++;
            document.getElementById('score').innerText = score;
            localStorage.setItem('hamster_score', score);
        }

        function requestWithdraw() {
            alert("So'rov qabul qilindi! 24 soat ichida ko'rib chiqiladi.");
        }

        function askAI() {
            document.getElementById('chat').innerText = "AI: Tangalarni bosib yig'ing va 5 TON dan boshlab yechib oling!";
        }
    </script>
</body>
</html>
