<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator 1xBet Style</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0b0e14; color: #ffffff; display: flex; flex-direction: column; align-items: center; padding: 10px; }
        .header { width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #151922; border-radius: 10px; margin-bottom: 10px; border: 1px solid #222a36; }
        .logo { color: #ff3333; font-weight: 900; font-size: 22px; font-style: italic; letter-spacing: 1px; }
        .balance { background: #1e2532; padding: 6px 12px; border-radius: 6px; font-size: 14px; color: #00ffcc; font-weight: bold; }
        
        .game-container { width: 100%; max-width: 400px; height: 230px; background: #111620; border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; overflow: hidden; border: 1px solid #222a36; margin-bottom: 10px; }
        
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        .center-info { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; }
        .multiplier { font-size: 46px; font-weight: 900; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
        .status-text { font-size: 13px; color: #8a99ad; margin-top: 4px; font-weight: 500; }
        
        .bet-box { width: 100%; max-width: 400px; background: #151922; padding: 14px; border-radius: 12px; border: 1px solid #222a36; }
        .bet-input-group { display: flex; align-items: center; background: #0b0e14; border-radius: 8px; padding: 8px 12px; border: 1px solid #2c3545; margin-bottom: 10px; }
        .bet-input-group input { background: transparent; border: none; color: #fff; font-size: 18px; width: 100%; outline: none; text-align: center; font-weight: bold; }
        
        .action-btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.1s; }
        .btn-bet { background-color: #28a745; color: white; }
        .btn-bet:active { background-color: #218838; }
        .btn-cashout { background-color: #ff9900; color: white; display: none; }
        .btn-cashout:active { background-color: #e08500; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">AVIA<span style="color:white">TOR</span></div>
        <div class="balance" id="balanceDisplay">1,000,000 UZS</div>
    </div>

    <div class="game-container">
        <canvas id="gameCanvas" width="400" height="230"></canvas>
        <div class="center-info">
            <div class="multiplier" id="multiplierDisplay">1.00x</div>
            <div class="status-text" id="statusText">Oʻyin boshlanishini kuting...</div>
        </div>
    </div>

    <div class="bet-box">
        <div class="bet-input-group">
            <input type="number" id="betAmount" value="1000" min="1000" max="500000">
        </div>
        <button class="action-btn btn-bet" id="betBtn" onclick="placeBet()">Stavka qo'yish</button>
        <button class="action-btn btn-cashout" id="cashOutBtn" onclick="cashOut()">CASH OUT <span id="cashOutAmount">0</span> UZS</button>
    </div>

    <script>
        let balance = 1000000;
        let currentMultiplier = 1.00;
        let isPlaying = false;
        let hasBet = false;
        let currentBet = 0;
        let crashPoint = 1.00;
        let gameInterval = null;

        const balanceDisplay = document.getElementById('balanceDisplay');
        const multiplierDisplay = document.getElementById('multiplierDisplay');
        const statusText = document.getElementById('statusText');
        const betBtn = document.getElementById('betBtn');
        const cashOutBtn = document.getElementById('cashOutBtn');
        const betInput = document.getElementById('betAmount');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function updateBalance() { 
            balanceDisplay.innerText = balance.toLocaleString() + " UZS"; 
        }

        function drawFlight(progress) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Orqa fondagi panjara chiziqlari
            ctx.strokeStyle = '#1a2230';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 40) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }
            for (let j = 0; j < canvas.height; j += 40) {
                ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvas.width, j); ctx.stroke();
            }

            if (!isPlaying && currentMultiplier === 1.00) return;

            let w = canvas.width;
            let h = canvas.height;
            let currentX = Math.min(w - 40, 40 + (progress * 300));
            let currentY = Math.max(30, h - 30 - (progress * 150));

            // Qizil uchish chizig'i
            ctx.beginPath();
            ctx.moveTo(0, h);
            ctx.quadraticCurveTo(currentX / 2, h - 10, currentX, currentY);
            ctx.strokeStyle = '#ff3333';
            ctx.lineWidth = 4;
            ctx.stroke();

            // Raketa / Samolyot belgisi
            ctx.font = "24px sans-serif";
            ctx.fillText("🚀", currentX - 12, currentY + 8);
        }

        function startGameCycle() {
            if (isPlaying) return;
            
            // 1xbet uslubidagi ehtimolliklar: Ko'p hollarda 1.00x - 1.20x da qulab tushadi
            let rand = Math.random();
            if (rand < 0.55) {
                crashPoint = parseFloat((1.00 + Math.random() * 0.20).toFixed(2)); // 55% ehtimol: 1.00x - 1.20x (Tez yutqazish)
            } else if (rand < 0.85) {
                crashPoint = parseFloat((1.21 + Math.random() * 2.00).toFixed(2)); // 30% ehtimol: 1.21x - 3.20x
            } else if (rand < 0.97) {
                crashPoint = parseFloat((3.21 + Math.random() * 15.00).toFixed(2)); // 12% ehtimol: 3.21x - 18.00x
            } else {
                crashPoint = parseFloat((18.01 + Math.random() * 182.00).toFixed(2)); // 3% ehtimol: Juda katta koeffitsient (200x gacha)
            }

            currentMultiplier = 1.00;
            isPlaying = true;
            statusText.innerText = "Samolyot uchmoqda...";
            multiplierDisplay.style.color = "#ffffff";

            betBtn.style.display = hasBet ? "none" : "block";
            cashOutBtn.style.display = hasBet ? "block" : "none";

            let startTime = Date.now();

            gameInterval = setInterval(() => {
                let elapsed = (Date.now() - startTime) / 1000;
                currentMultiplier = parseFloat((1.00 + (elapsed * elapsed * 0.15)).toFixed(2));
                
                if (currentMultiplier >= crashPoint) {
                    currentMultiplier = crashPoint;
                    clearInterval(gameInterval);
                    endGame(false);
                }

                multiplierDisplay.innerText = currentMultiplier.toFixed(2) + "x";
                drawFlight(elapsed);

                if (hasBet) {
                    let potentialWin = Math.floor(currentBet * currentMultiplier);
                    document.getElementById('cashOutAmount').innerText = potentialWin.toLocaleString();
                }
            }, 40);
        }

        function placeBet() {
            let amount = parseInt(betInput.value);
            if (amount < 1000 || amount > 500000) { alert("Stavka 1,000 dan 500,000 gacha bo'lishi kerak!"); return; }
            if (amount > balance) { alert("Balansingizda yetarli mablag' yo'q!"); return; }
            
            balance -= amount;
            currentBet = amount;
            hasBet = true;
            updateBalance();
            betBtn.disabled = true;
            betBtn.innerText = "Kutilmoqda...";
        }

        function cashOut() {
            if (!hasBet || !isPlaying) return;
            let winAmount = Math.floor(currentBet * currentMultiplier);
            balance += winAmount;
            hasBet = false;
            updateBalance();
            
            statusText.innerText = `Yutib oldingiz: ${winAmount.toLocaleString()} UZS!`;
            statusText.style.color = "#00ffcc";
            
            cashOutBtn.style.display = "none";
            betBtn.style.display = "block";
            betBtn.disabled = false;
            betBtn.innerText = "Stavka qo'yish";
        }

        function endGame(isWon) {
            isPlaying = false;
            multiplierDisplay.innerText = crashPoint.toFixed(2) + "x";
            multiplierDisplay.style.color = "#ff3333";
            statusText.innerText = "Uchib ketdi!";

            if (hasBet) {
                hasBet = false;
            }

            betBtn.style.display = "block";
            betBtn.disabled = false;
            betBtn.innerText = "Stavka qo'yish";
            cashOutBtn.style.display = "none";

            setTimeout(() => {
                statusText.innerText = "Yangi raund boshlanmoqda...";
                setTimeout(startGameCycle, 2000);
            }, 1000);
        }

        updateBalance();
        drawFlight(0);
        setTimeout(startGameCycle, 1500);
    </script>
</body>
</html>
