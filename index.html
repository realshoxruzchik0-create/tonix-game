<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator SO'M</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            background-color: #0c0f16;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow-x: hidden;
        }
        /* Loader Screen */
        #loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0c0f16;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        .loader-logo {
            font-size: 32px;
            font-weight: 900;
            font-style: italic;
            color: #ff334b;
            margin-bottom: 5px;
            text-shadow: 0 0 15px rgba(255, 51, 75, 0.5);
        }
        .loader-sub {
            font-size: 14px;
            color: #888;
            margin-bottom: 25px;
            letter-spacing: 2px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #222938;
            border-top: 4px solid #ff334b;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: #141923;
            border-bottom: 1px solid #222938;
        }
        .logo {
            color: #ff334b;
            font-weight: 900;
            font-style: italic;
            font-size: 22px;
            letter-spacing: 1px;
        }
        .balance {
            color: #00e676;
            font-weight: bold;
            font-size: 15px;
            background: #1a2230;
            padding: 5px 12px;
            border-radius: 20px;
        }
        .history-bar {
            display: flex;
            gap: 6px;
            padding: 8px 12px;
            background: #10141d;
            overflow-x: auto;
            white-space: nowrap;
        }
        .hist-item {
            font-size: 12px;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 6px;
            background: #1a2230;
        }
        .h-purple { color: #b57edc; }
        .h-blue { color: #3ea6ff; }
        .h-red { color: #ff334b; }

        /* Game Screen */
        .game-screen {
            position: relative;
            height: 230px;
            background: radial-gradient(circle, #25121a 0%, #0c0f16 80%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-bottom: 2px solid #ff334b;
        }
        .multiplier {
            font-size: 48px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 51, 75, 0.6);
        }
        .status-text {
            font-size: 13px;
            color: #888;
            margin-top: 5px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .online-users {
            position: absolute;
            bottom: 10px;
            right: 15px;
            background: rgba(0, 0, 0, 0.6);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            color: #bbb;
        }

        /* Bet Panels */
        .bet-container {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .bet-card {
            background: #141923;
            border-radius: 16px;
            padding: 12px;
            border: 1px solid #222938;
        }
        .bet-tabs {
            display: flex;
            background: #0c0f16;
            border-radius: 10px;
            padding: 2px;
            margin-bottom: 10px;
            width: fit-content;
        }
        .bet-tab {
            padding: 4px 16px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            color: #888;
        }
        .bet-tab.active {
            background: #222d42;
            color: white;
        }
        .bet-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .amount-control {
            display: flex;
            align-items: center;
            background: #0c0f16;
            border-radius: 10px;
            padding: 6px 10px;
            flex: 1;
            border: 1px solid #222938;
        }
        .amount-control button {
            background: none;
            border: none;
            color: #888;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        .amount-control input {
            background: none;
            border: none;
            color: white;
            font-size: 15px;
            font-weight: bold;
            width: 100%;
            text-align: center;
            outline: none;
        }
        .action-btn {
            flex: 1.2;
            background: #ffcc00;
            color: #000;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 900;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 15px rgba(255, 204, 0, 0.3);
        }
        .quick-amounts {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-top: 8px;
        }
        .q-btn {
            background: #1a2230;
            border: none;
            color: #ccc;
            padding: 6px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }
        .footer-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #10141d;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #222938;
            font-size: 12px;
            color: #888;
        }
        .footer-nav div {
            cursor: pointer;
        }
        .footer-nav .active-ft {
            color: #ff334b;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Yuklanish Ekrani -->
    <div id="loader">
        <div class="loader-logo">Aviator SO'M</div>
        <div class="loader-sub">X7000 ROKETA</div>
        <div class="spinner"></div>
    </div>

    <div class="header">
        <div class="logo">Aviator</div>
        <div class="balance" id="balance">150,000 SO'M</div>
    </div>

    <div class="history-bar" id="history-bar">
        <span class="hist-item h-purple">10.45x</span>
        <span class="hist-item h-blue">1.20x</span>
        <span class="hist-item h-red">1.00x</span>
        <span class="hist-item h-purple">x72.50</span>
    </div>

    <div class="game-screen">
        <div class="multiplier" id="multiplier">1.00x</div>
        <div class="status-text" id="status-text">O'YIN BOSHLANISHIGA TAYYORGARLIK</div>
        <div class="online-users">👥 842</div>
    </div>

    <div class="bet-container" style="padding-bottom: 70px;">
        <!-- 1-stavka bloki -->
        <div class="bet-card">
            <div class="bet-tabs">
                <div class="bet-tab active">Bet</div>
                <div class="bet-tab">Auto</div>
            </div>
            <div class="bet-row">
                <div class="amount-control">
                    <button onclick="changeBet(1, -5000)">-</button>
                    <input type="text" id="bet1" value="10000">
                    <button onclick="changeBet(1, 5000)">+</button>
                </div>
                <button class="action-btn" id="btn1" onclick="handleBet(1)">BET<br><span style="font-size:10px">10,000 SO'M</span></button>
            </div>
            <div class="quick-amounts">
                <button class="q-btn" onclick="setBet(1, 5000)">5K</button>
                <button class="q-btn" onclick="setBet(1, 10000)">10K</button>
                <button class="q-btn" onclick="setBet(1, 50000)">50K</button>
                <button class="q-btn" onclick="setBet(1, 100000)">100K</button>
            </div>
        </div>

        <!-- 2-stavka bloki -->
        <div class="bet-card">
            <div class="bet-tabs">
                <div class="bet-tab active">Bet</div>
                <div class="bet-tab">Auto</div>
            </div>
            <div class="bet-row">
                <div class="amount-control">
                    <button onclick="changeBet(2, -5000)">-</button>
                    <input type="text" id="bet2" value="5000">
                    <button onclick="changeBet(2, 5000)">+</button>
                </div>
                <button class="action-btn" id="btn2" onclick="handleBet(2)">BET<br><span style="font-size:10px">5,000 SO'M</span></button>
            </div>
            <div class="quick-amounts">
                <button class="q-btn" onclick="setBet(2, 5000)">5K</button>
                <button class="q-btn" onclick="setBet(2, 10000)">10K</button>
                <button class="q-btn" onclick="setBet(2, 50000)">50K</button>
                <button class="q-btn" onclick="setBet(2, 100000)">100K</button>
            </div>
        </div>
    </div>

    <div class="footer-nav">
        <div class="active-ft">All Bets</div>
        <div>Previous</div>
        <div>Top</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let userBalance = parseFloat(localStorage.getItem('aviator_som_balance') || "150000");
        document.getElementById('balance').innerText = userBalance.toLocaleString() + " SO'M";

        setTimeout(() => {
            let loader = document.getElementById('loader');
            loader.style.opacity = '0';
            setTimeout(() => loader.style.display = 'none', 500);
        }, 1500);

        let gameState = 'waiting'; // waiting, playing, crashed
        let currentMultiplier = 1.00;
        let crashPoint = 1.00;
        let gameInterval = null;
        
        let bet1State = 'none'; // none, active, next_round
        let bet2State = 'none';
        let bet1Amount = 10000;
        let bet2Amount = 5000;

        function saveBalance() {
            localStorage.setItem('aviator_som_balance', userBalance);
            document.getElementById('balance').innerText = userBalance.toLocaleString() + " SO'M";
        }

        function setBet(box, val) {
            document.getElementById('bet' + box).value = val;
            if(box === 1) bet1Amount = val;
            else bet2Amount = val;
            updateButtonVisual(box);
        }

        function changeBet(box, delta) {
            let input = document.getElementById('bet' + box);
            let val = parseInt(input.value) + delta;
            if(val < 1000) val = 1000;
            input.value = val;
            if(box === 1) bet1Amount = val;
            else bet2Amount = val;
            updateButtonVisual(box);
        }

        function updateButtonVisual(box) {
            let val = parseInt(document.getElementById('bet' + box).value);
            let btn = document.getElementById('btn' + box);
            let state = (box === 1) ? bet1State : bet2State;

            if(state === 'none') {
                btn.style.background = "#ffcc00";
                btn.style.color = "#000";
                btn.innerHTML = `BET<br><span style="font-size:10px">${val.toLocaleString()} SO'M</span>`;
            } else if(state === 'next_round') {
                btn.style.background = "#28a745";
                btn.style.color = "white";
                btn.innerHTML = `BEKOR QILISH<br><span style="font-size:10px">KUTILMOqda</span>`;
            } else if(state === 'active') {
                btn.style.background = "#ff334b";
                btn.style.color = "white";
                btn.innerHTML = `CASH OUT<br><span style="font-size:10px">${val.toLocaleString()} SO'M</span>`;
            }
        }

        function handleBet(box) {
            let val = parseInt(document.getElementById('bet' + box).value);
            let currentState = (box === 1) ? bet1State : bet2State;

            if(currentState === 'none') {
                if(userBalance < val) { alert("Hisobda yetarli mablag' yo'q!"); return; }
                userBalance -= val;
                saveBalance();
                if(box === 1) bet1Amount = val; else bet2Amount = val;

                if(gameState === 'playing') {
                    // O'yin ketayotgan bo'lsa, keyingi raundga yoziladi
                    if(box === 1) bet1State = 'next_round'; else bet2State = 'next_round';
                } else {
                    // Kutish vaqtida darhol faollashadi
                    if(box === 1) bet1State = 'active'; else bet2State = 'active';
                }
                updateButtonVisual(box);

            } else if(currentState === 'next_round') {
                // Keyingi raundga tikilgan stavkani qaytarib olish (bekor qilish)
                userBalance += val;
                saveBalance();
                if(box === 1) bet1State = 'none'; else bet2State = 'none';
                updateButtonVisual(box);

            } else if(currentState === 'active') {
                // O'yin paytida CASH OUT qilish
                if(gameState === 'playing') {
                    let win = (box === 1 ? bet1Amount : bet2Amount) * currentMultiplier;
                    userBalance += Math.floor(win);
                    saveBalance();
                    alert(`Tabriklayman! ${Math.floor(win).toLocaleString()} SO'M yutib oldingiz!`);
                }
                if(box === 1) bet1State = 'none'; else bet2State = 'none';
                updateButtonVisual(box);
            }
        }

        function startWaitingPeriod() {
            gameState = 'waiting';
            currentMultiplier = 1.00;
            document.getElementById('multiplier').innerText = "1.00x";
            document.getElementById('multiplier').style.color = "#fff";
            document.getElementById('status-text').innerText = "KEYINGI O'YIN BOSHLANISHIGA...";

            // Keyingi raundga kutilayotgan stavkalarni aktivlashtirish
            if(bet1State === 'next_round') bet1State = 'active';
            if(bet2State === 'next_round') bet2State = 'active';
            updateButtonVisual(1);
            updateButtonVisual(2);
            
            let countdown = 5;
            let cdInterval = setInterval(() => {
                document.getElementById('status-text').innerText = `KEYINGI O'YIN: ${countdown}s`;
                countdown--;
                if(countdown < 0) {
                    clearInterval(cdInterval);
                    startFlight();
                }
            }, 1000);
        }

        function startFlight() {
            gameState = 'playing';
            document.getElementById('status-text').innerText = "UCHOQ UCHMOQDA...";
            
            // Haqiqiy Aviator ehtimolligi: 1.00x da o'lishi yoki 6000x gacha chiqishi
            let rand = Math.random();
            if(rand < 0.12) {
                crashPoint = 1.00; // Darhol 1.00x da o'lishi
            } else if(rand < 0.35) {
                crashPoint = parseFloat((1.01 + Math.random() * 0.3).toFixed(2)); // 1.01x - 1.30x oralig'ida tez o'lishi
            } else {
                crashPoint = parseFloat((1.31 + Math.pow(Math.random(), 3.5) * 5998.69).toFixed(2));
                if(crashPoint > 6000) crashPoint = 6000.00;
            }

            gameInterval = setInterval(() => {
                currentMultiplier += 0.01 + (currentMultiplier * 0.025);
                if(currentMultiplier >= crashPoint) {
                    currentMultiplier = crashPoint;
                    clearInterval(gameInterval);
                    triggerCrash();
                }
                
                document.getElementById('multiplier').innerText = currentMultiplier.toFixed(2) + "x";

                if(bet1State === 'active') {
                    document.getElementById('btn1').innerHTML = `CASH OUT<br><span style="font-size:10px">${Math.floor(bet1Amount * currentMultiplier).toLocaleString()} SO'M</span>`;
                }
                if(bet2State === 'active') {
                    document.getElementById('btn2').innerHTML = `CASH OUT<br><span style="font-size:10px">${Math.floor(bet2Amount * currentMultiplier).toLocaleString()} SO'M</span>`;
                }
            }, 100);
        }

        function triggerCrash() {
            gameState = 'crashed';
            document.getElementById('multiplier').style.color = "#ff334b";
            document.getElementById('status-text').innerText = "UCHIB KETDI! (" + currentMultiplier.toFixed(2) + "x)";

            if(bet1State === 'active') { bet1State = 'none'; updateButtonVisual(1); }
            if(bet2State === 'active') { bet2State = 'none'; updateButtonVisual(2); }

            let hBar = document.getElementById('history-bar');
            let cssClass = currentMultiplier > 10 ? "h-purple" : (currentMultiplier > 2 ? "h-blue" : "h-red");
            hBar.insertAdjacentHTML('afterbegin', `<span class="hist-item ${cssClass}">${currentMultiplier.toFixed(2)}x</span>`);

            setTimeout(startWaitingPeriod, 3000);
        }

        setTimeout(startWaitingPeriod, 1500);
    </script>
</body>
</html>
