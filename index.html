<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tonix Game</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; user-select: none; }
body { background: linear-gradient(180deg, #ffffff 0%, #e0eafc 100%); color: #333; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

.container { flex: 1; padding: 20px; display: flex; flex-direction: column; align-items: center; overflow-y: auto; }
.page { display: none; width: 100%; flex-direction: column; align-items: center; }
.page.active { display: flex; }

.card { background: rgba(255,255,255,0.7); border-radius: 25px; padding: 25px; margin-bottom: 20px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
.val { font-size: 32px; font-weight: bold; color: #007bff; margin: 10px 0; }

/* Wallet elementlari */
.w-card { background: #fff; border-radius: 20px; padding: 20px; width: 100%; max-width: 400px; border: 1px solid #e0e0e0; margin-bottom: 15px; }
.inp { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #ccc; background: #f9f9f9; margin-top: 5px; }
.sub { width: 100%; padding: 14px; background: #007bff; color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 10px; }

.btn { width: 160px; height: 160px; border-radius: 50%; background: radial-gradient(circle, #00d2ff 0%, #007bff 100%); display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 10px 20px rgba(0,123,255,0.3); }

nav { display: flex; justify-content: space-around; background: rgba(255,255,255,0.95); padding: 15px 0; border-top: 1px solid #ddd; }
.nav { color: #888; font-size: 12px; font-weight: bold; cursor: pointer; }
.nav.active { color: #007bff; }
</style>
</head>
<body>

<div class="container">
    <div id="home" class="page active">
        <div class="card">
            <div style="font-size: 13px; color: #666;">TONIX Balans</div>
            <div id="balance" class="val">285 TONIX</div>
        </div>
        <button class="btn" onclick="tapCoin()">
            <div style="width: 120px; height: 120px; border-radius: 50%; background-image: url('https://img.freepik.com/free-vector/cute-hamster-holding-gold-coin-cartoon-vector-icon-illustration-animal-finance-icon-concept-isolated-premium-vector-flat-cartoon-style_138676-3686.jpg'); background-size: cover;"></div>
        </button>
    </div>

    <div id="wallet" class="page">
        <div class="w-card">
            <h3 style="margin-bottom: 10px;">💳 Hisobni To'ldirish</h3>
            <p style="font-size: 13px; color: #666;">Karta: 9860 6067 5865 7385</p>
            <p style="font-size: 13px; color: #666; margin-bottom: 10px;">Egasi: Xolboyeva S.</p>
            <input type="number" class="inp" placeholder="Summani kiriting (so'm)">
            <input type="file" class="inp" accept="image/*">
            <button class="sub" onclick="alert('Yuborildi!')">To'lovni tasdiqlash</button>
        </div>
    </div>
</div>

<nav>
    <div class="nav active" onclick="go('home', this)">🏠 Home</div>
    <div class="nav" onclick="go('wallet', this)">👛 Wallet</div>
    <div class="nav" onclick="go('friends', this)">👥 Friends</div>
</nav>

<script>
let score = 285;
function tapCoin() {
    score += 1;
    document.getElementById('balance').innerText = score + " TONIX";
}
function go(id, el) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    document.querySelectorAll('.nav').forEach(n => n.classList.remove('active'));
    el.classList.add('active');
}
</script>
</body>
</html>
