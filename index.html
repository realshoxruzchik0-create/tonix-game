<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator TON</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            background-color: #0c0f16;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow-x: hidden;
        }
        /* Loader Screen */
        #loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0c0f16;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        .loader-logo {
            font-size: 32px;
            font-weight: 900;
            font-style: italic;
            color: #ff334b;
            margin-bottom: 5px;
            text-shadow: 0 0 15px rgba(255, 51, 75, 0.5);
        }
        .loader-sub {
            font-size: 14px;
            color: #888;
            margin-bottom: 25px;
            letter-spacing: 2px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #222938;
            border-top: 4px solid #ff334b;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: #141923;
            border-bottom: 1px solid #222938;
        }
        .logo {
            color: #ff334b;
            font-weight: 900;
            font-style: italic;
            font-size: 22px;
            letter-spacing: 1px;
        }
        .balance {
            color: #00e676;
            font-weight: bold;
            font-size: 16px;
            background: #1a2230;
            padding: 5px 12px;
            border-radius: 20px;
        }
        .history-bar {
            display: flex;
            gap: 6px;
            padding: 8px 12px;
            background: #10141d;
            overflow-x: auto;
            white-space: nowrap;
        }
        .hist-item {
            font-size: 12px;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 6px;
            background: #1a2230;
        }
        .h-purple { color: #b57edc; }
        .h-blue { color: #3ea6ff; }
        .h-red { color: #ff334b; }

        /* Game Screen */
        .game-screen {
            position: relative;
            height: 230px;
            background: radial-gradient(circle, #25121a 0%, #0c0f16 80%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-bottom: 2px solid #ff334b;
        }
        .multiplier {
            font-size: 48px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 51, 75, 0.6);
        }
        .status-text {
            font-size: 14px;
            color: #888;
            margin-top: 5px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .online-users {
            position: absolute;
            bottom: 10px;
            right: 15px;
            background: rgba(0, 0, 0, 0.6);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            color: #bbb;
        }

        /* Bet Panels */
        .bet-container {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .bet-card {
            background: #141923;
            border-radius: 16px;
            padding: 12px;
            border: 1px solid #222938;
        }
        .bet-tabs {
            display: flex;
            background: #0c0f16;
            border-radius: 10px;
            padding: 2px;
            margin-bottom: 10px;
            width: fit-content;
        }
        .bet-tab {
            padding: 4px 16px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            color: #888;
        }
        .bet-tab.active {
            background: #222d42;
            color: white;
        }
        .bet-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .amount-control {
            display: flex;
            align-items: center;
            background: #0c0f16;
            border-radius: 10px;
            padding: 6px 10px;
            flex: 1;
            border: 1px solid #222938;
        }
        .amount-control button {
            background: none;
            border: none;
            color: #888;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        .amount-control input {
            background: none;
            border: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            text-align: center;
            outline: none;
        }
        .action-btn {
            flex: 1.2;
            background: #ffcc00;
            color: #000;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: 900;
            font-size: 15px;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 15px rgba(255, 204, 0, 0.3);
        }
        .quick-amounts {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-top: 8px;
        }
        .q-btn {
            background: #1a2230;
            border: none;
            color: #ccc;
            padding: 6px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        .footer-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #10141d;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #222938;
            font-size: 12px;
            color: #888;
        }
        .footer-nav div {
            cursor: pointer;
        }
        .footer-nav .active-ft {
            color: #ff334b;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Yuklanish Ekrani -->
    <div id="loader">
        <div class="loader-logo">Aviator TON</div>
        <div class="loader-sub">X7000 ROKETA</div>
        <div class="spinner"></div>
    </div>

    <div class="header">
        <div class="logo">Aviator</div>
        <div class="balance" id="balance">10.00 TON</div>
    </div>

    <div class="history-bar" id="history-bar">
        <span class="hist-item h-purple">10.45x</span>
        <span class="hist-item h-blue">1.31x</span>
        <span class="hist-item h-purple">x72.50</span>
    </div>

    <div class="game-screen">
        <div class="multiplier" id="multiplier">1.00x</div>
        <div class="status-text" id="status-text">O'YIN BOSHLANISHIGA TAYYORGARLIK</div>
        <div class="online-users">👥 742</div>
    </div>

    <div class="bet-container" style="padding-bottom: 70px;">
        <!-- 1-stavka bloki -->
        <div class="bet-card">
            <div class="bet-tabs">
                <div class="bet-tab active">Bet</div>
                <div class="bet-tab">Auto</div>
            </div>
            <div class="bet-row">
                <div class="amount-control">
                    <button onclick="changeBet(1, -0.5)">-</button>
                    <input type="text" id="bet1" value="1.00">
                    <button onclick="changeBet(1, 0.5)">+</button>
                </div>
                <button class="action-btn" id="btn1" onclick="handleBet(1)">BET<br><span style="font-size:11px">1.00 TON</span></button>
            </div>
            <div class="quick-amounts">
                <button class="q-btn" onclick="setBet(1, 0.5)">0.5</button>
                <button class="q-btn" onclick="setBet(1, 1.0)">1.0</button>
                <button class="q-btn" onclick="setBet(1, 5.0)">5.0</button>
                <button class="q-btn" onclick="setBet(1, 10.0)">10.0</button>
            </div>
        </div>

        <!-- 2-stavka bloki -->
        <div class="bet-card">
            <div class="bet-tabs">
                <div class="bet-tab active">Bet</div>
                <div class="bet-tab">Auto</div>
            </div>
            <div class="bet-row">
                <div class="amount-control">
                    <button onclick="changeBet(2, -0.5)">-</button>
                    <input type="text" id="bet2" value="0.50">
                    <button onclick="changeBet(2, 0.5)">+</button>
                </div>
                <button class="action-btn" id="btn2" onclick="handleBet(2)">BET<br><span style="font-size:11px">0.50 TON</span></button>
            </div>
            <div class="quick-amounts">
                <button class="q-btn" onclick="setBet(2, 0.5)">0.5</button>
                <button class="q-btn" onclick="setBet(2, 1.0)">1.0</button>
                <button class="q-btn" onclick="setBet(2, 5.0)">5.0</button>
                <button class="q-btn" onclick="setBet(2, 10.0)">10.0</button>
            </div>
        </div>
    </div>

    <div class="footer-nav">
        <div class="active-ft">All Bets</div>
        <div>Previous</div>
        <div>Top</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // Load balance from localStorage or set default 10 TON
        let userBalance = parseFloat(localStorage.getItem('aviator_balance') || "10.00");
        document.getElementById('balance').innerText = userBalance.toFixed(2) + " TON";

        // Hide loader after 1.5 seconds
        setTimeout(() => {
            let loader = document.getElementById('loader');
            loader.style.opacity = '0';
            setTimeout(() => loader.style.display = 'none', 500);
        }, 1500);

        let gameState = 'waiting'; // waiting, playing, crashed
        let currentMultiplier = 1.00;
        let crashPoint = 1.00;
        let gameInterval = null;
        
        let bet1Active = false;
        let bet2Active = false;
        let bet1Amount = 1.00;
        let bet2Amount = 0.50;

        function saveBalance() {
            localStorage.setItem('aviator_balance', userBalance.toFixed(2));
            document.getElementById('balance').innerText = userBalance.toFixed(2) + " TON";
        }

        function setBet(box, val) {
            document.getElementById('bet' + box).value = val.toFixed(2);
            if(box === 1) bet1Amount = val;
            else bet2Amount = val;
            updateButton(box);
        }

        function changeBet(box, delta) {
            let input = document.getElementById('bet' + box);
            let val = parseFloat(input.value) + delta;
            if(val < 0.1) val = 0.1;
            input.value = val.toFixed(2);
            if(box === 1) bet1Amount = val;
            else bet2Amount = val;
            updateButton(box);
        }

        function updateButton(box) {
            let val = document.getElementById('bet' + box).value;
            let btn = document.getElementById('btn' + box);
            if(!((box === 1 && bet1Active) || (box === 2 && bet2Active))) {
                btn.innerHTML = `BET<br><span style="font-size:11px">${val} TON</span>`;
            }
        }

        function handleBet(box) {
            let val = parseFloat(document.getElementById('bet' + box).value);
            let btn = document.getElementById('btn' + box);

            if(box === 1) {
                if(!bet1Active) {
                    if(userBalance < val) { alert("Balansda yetarli mablag' yo'q!"); return; }
                    userBalance -= val;
                    saveBalance();
                    bet1Amount = val;
                    bet1Active = true;
                    btn.style.background = "#ff334b";
                    btn.style.color = "white";
                    btn.innerHTML = `CASH OUT<br><span style="font-size:11px">${val.toFixed(2)} TON</span>`;
                } else {
                    // Cash out 1
                    if(gameState === 'playing') {
                        let win = bet1Amount * currentMultiplier;
                        userBalance += win;
                        saveBalance();
                        alert(`Tabriklayman! ${win.toFixed(2)} TON yutib oldingiz!`);
                    }
                    bet1Active = false;
                    btn.style.background = "#ffcc00";
                    btn.style.color = "#000";
                    updateButton(1);
                }
            } else {
                if(!bet2Active) {
                    if(userBalance < val) { alert("Balansda yetarli mablag' yo'q!"); return; }
                    userBalance -= val;
                    saveBalance();
                    bet2Amount = val;
                    bet2Active = true;
                    btn.style.background = "#ff334b";
                    btn.style.color = "white";
                    btn.innerHTML = `CASH OUT<br><span style="font-size:11px">${val.toFixed(2)} TON</span>`;
                } else {
                    // Cash out 2
                    if(gameState === 'playing') {
                        let win = bet2Amount * currentMultiplier;
                        userBalance += win;
                        saveBalance();
                        alert(`Tabriklayman! ${win.toFixed(2)} TON yutib oldingiz!`);
                    }
                    bet2Active = false;
                    btn.style.background = "#ffcc00";
                    btn.style.color = "#000";
                    updateButton(2);
                }
            }
        }

        // Real Aviator Game Loop with random crash up to 6000x and strict 1.00x chances
        function startWaitingPeriod() {
            gameState = 'waiting';
            currentMultiplier = 1.00;
            document.getElementById('multiplier').innerText = "1.00x";
            document.getElementById('multiplier').style.color = "#fff";
            document.getElementById('status-text').innerText = "KEYINGI O'YIN BOSHLANISHIGA...";
            
            let countdown = 5;
            let cdInterval = setInterval(() => {
                document.getElementById('status-text').innerText = `KEYINGI O'YIN: ${countdown}s`;
                countdown--;
                if(countdown < 0) {
                    clearInterval(cdInterval);
                    startFlight();
                }
            }, 1000);
        }

        function startFlight() {
            gameState = 'playing';
            document.getElementById('status-text').innerText = "UCHOQ UCHMOQDA...";
            
            // Generate realistic crash point (1.00x to 6000x, highly weighted towards lower numbers)
            let rand = Math.random();
            if(rand < 0.08) {
                crashPoint = 1.00; // Immediate 1.00x crash
            } else {
                // Exponential random distribution up to 6000x
                crashPoint = parseFloat((1.01 + Math.pow(Math.random(), 4) * 5999).toFixed(2));
                if(crashPoint > 6000) crashPoint = 6000.00;
            }

            gameInterval = setInterval(() => {
                // Increment multiplier smoothly
                currentMultiplier += 0.01 + (currentMultiplier * 0.03);
                if(currentMultiplier >= crashPoint) {
                    currentMultiplier = crashPoint;
                    clearInterval(gameInterval);
                    triggerCrash();
                }
                
                document.getElementById('multiplier').innerText = currentMultiplier.toFixed(2) + "x";

                // Update active cash out buttons text with live winnings
                if(bet1Active) {
                    document.getElementById('btn1').innerHTML = `CASH OUT<br><span style="font-size:11px">${(bet1Amount * currentMultiplier).toFixed(2)} TON</span>`;
                }
                if(bet2Active) {
                    document.getElementById('btn2').innerHTML = `CASH OUT<br><span style="font-size:11px">${(bet2Amount * currentMultiplier).toFixed(2)} TON</span>`;
                }
            }, 100);
        }

        function triggerCrash() {
            gameState = 'crashed';
            document.getElementById('multiplier').style.color = "#ff334b";
            document.getElementById('status-text').innerText = "UCHIB KETDI! (" + currentMultiplier.toFixed(2) + "x)";

            // Auto-fail active bets if not cashed out
            if(bet1Active) {
                bet1Active = false;
                let btn1 = document.getElementById('btn1');
                btn1.style.background = "#ffcc00";
                btn1.style.color = "#000";
                updateButton(1);
            }
            if(bet2Active) {
                bet2Active = false;
                let btn2 = document.getElementById('btn2');
                btn2.style.background = "#ffcc00";
                btn2.style.color = "#000";
                updateButton(2);
            }

            // Add to history bar
            let hBar = document.getElementById('history-bar');
            let cssClass = currentMultiplier > 10 ? "h-purple" : (currentMultiplier > 2 ? "h-blue" : "h-red");
            hBar.insertAdjacentHTML('afterbegin', `<span class="hist-item ${cssClass}">${currentMultiplier.toFixed(2)}x</span>`);

            setTimeout(startWaitingPeriod, 3000);
        }

        // Start the game loop
        setTimeout(startWaitingPeriod, 1500);
    </script>
</body>
</html>
