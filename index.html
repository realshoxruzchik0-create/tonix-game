<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoinCepar TapTap</title>
    <!-- Telegram WebApp uchun skript -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #2e0854, #13002f, #090014);
            background-attachment: fixed;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 94vh;
            user-select: none;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.08);
            padding: 8px 12px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
        }
        .user-info {
            font-size: 14px;
            font-weight: bold;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .wallet-btn {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: #facc15;
            padding: 6px 12px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }
        .score-section {
            margin: 5px 0;
        }
        .score {
            font-size: 38px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 1px;
        }
        .league {
            font-size: 14px;
            color: #c084fc;
            font-weight: 600;
            margin-top: -2px;
        }
        .coin-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
        }
        .coin {
            width: 210px;
            height: 210px;
            background: #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 35px rgba(168, 85, 247, 0.4);
            transition: transform 0.08s ease;
            overflow: hidden;
        }
        .coin img {
            width: 95%;
            height: 95%;
            object-fit: contain;
            pointer-events: none;
        }
        .coin:active {
            transform: scale(0.92);
        }
        .bottom-section {
            background: rgba(255, 255, 255, 0.06);
            padding: 12px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
        }
        .energy-box {
            font-size: 14px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            color: #e2e8f0;
        }
        .energy-bar-container {
            width: 100%;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            height: 10px;
            overflow: hidden;
            margin-top: 4px;
        }
        .energy-bar {
            height: 100%;
            background: linear-gradient(90deg, #a855f7, #ec4899);
            width: 100%;
            transition: width 0.2s;
            border-radius: 10px;
        }
        .shop {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        .shop-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 11px;
            flex: 1;
            color: #e2e8f0;
        }
        .shop-btn span {
            color: #facc15;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Fon musiqasi -->
    <audio id="bgMusic" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mp3">
    </audio>

    <div class="top-bar">
        <div class="user-info" id="userName">Foydalanuvchi ✅</div>
        <button class="wallet-btn" onclick="openWallet()">💳 Hamyon</button>
    </div>

    <div class="score-section">
        <div class="score" id="score">0</div>
        <div class="league">🏆 Degens</div>
    </div>

    <div class="coin-container">
        <div class="coin" id="tapBtn">
            <img src="https://t.me/uzebdiodn/2" alt="Burgut Logo">
        </div>
    </div>

    <div class="bottom-section">
        <div class="energy-box">
            <span>⚡ Energiya</span>
            <span><span id="energy">100</span> / <span id="maxEnergyLabel">100</span></span>
        </div>
        <div class="energy-bar-container">
            <div class="energy-bar" id="energyBar"></div>
        </div>

        <div class="shop">
            <button class="shop-btn" onclick="upgradeClick()">
                🚀 <b>Tap Kuchaytir</b><br>+<span id="clickPower">1</span> | <span><span id="clickPrice">5000</span> so'm</span>
            </button>
            <button class="shop-btn" onclick="upgradeEnergy()">
                ⚡ <b>Energiya Max</b><br>Max: <span id="maxEnergyText">100</span> | <span><span id="energyPrice">10000</span> so'm</span>
            </button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        const userNameEl = document.getElementById('userName');
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            let firstName = tg.initDataUnsafe.user.first_name || "O'yinchi";
            userNameEl.innerText = firstName + " ✅";
        } else {
            userNameEl.innerText = "Shoxruz ✅";
        }

        let score = parseInt(localStorage.getItem('cc_score')) || 0;
        let maxEnergy = parseInt(localStorage.getItem('cc_maxEnergy')) || 100;
        let energy = parseInt(localStorage.getItem('cc_energy')) || maxEnergy;
        let clickPower = parseInt(localStorage.getItem('cc_clickPower')) || 1;
        
        let clickPrice = parseInt(localStorage.getItem('cc_clickPrice')) || 5000;
        let energyPrice = parseInt(localStorage.getItem('cc_energyPrice')) || 10000;

        const scoreEl = document.getElementById('score');
        const energyEl = document.getElementById('energy');
        const maxEnergyLabel = document.getElementById('maxEnergyLabel');
        const maxEnergyText = document.getElementById('maxEnergyText');
        const energyBar = document.getElementById('energyBar');
        const tapBtn = document.getElementById('tapBtn');
        const clickPowerEl = document.getElementById('clickPower');
        const clickPriceEl = document.getElementById('clickPrice');
        const energyPriceEl = document.getElementById('energyPrice');
        const bgMusic = document.getElementById('bgMusic');

        updateUI();

        document.body.addEventListener('click', () => {
            if (bgMusic.paused) {
                bgMusic.play().catch(e => console.log("Audio play error:", e));
            }
        }, { once: true });

        tapBtn.addEventListener('click', () => {
            if (energy >= clickPower) {
                score += clickPower;
                energy -= clickPower;
                
                updateUI();
                saveData();
            }
        });

        function openWallet() {
            alert("🚀 Tez kunda! Hozircha biz rivojlanish bosqichidamiz. Tez orada katta toifalar va hamyonga chiqarish imkoniyati ochiladi! Sabr bilan tanga yig'ishda davom eting! 🔥");
        }

        setInterval(() => {
            if (energy < maxEnergy) {
                energy += 1;
                if (energy > maxEnergy) energy = maxEnergy;
                updateUI();
                saveData();
            }
        }, 1000);

        function upgradeClick() {
            if (score >= clickPrice) {
                score -= clickPrice;
                clickPower += 1;
                clickPrice = Math.floor(clickPrice * 3.5);
                updateUI();
                saveData();
            } else {
                alert("Tangangiz yetarli emas! Ko'proq tanga yig'ing.");
            }
        }

        function upgradeEnergy() {
            if (score >= energyPrice && maxEnergy < 70000) {
                score -= energyPrice;
                maxEnergy += 500;
                energy = maxEnergy;
                energyPrice = Math.floor(energyPrice * 3.0);
                updateUI();
                saveData();
            } else {
                alert("Yo yetarli tanga yo'q, yoki energiya limiti oxiriga (70,000) yetdi!");
            }
        }

        function updateUI() {
            scoreEl.innerText = score;
            energyEl.innerText = energy;
            maxEnergyLabel.innerText = maxEnergy;
            maxEnergyText.innerText = maxEnergy;
            clickPowerEl.innerText = clickPower;
            clickPriceEl.innerText = clickPrice;
            energyPriceEl.innerText = energyPrice;

            let percent = (energy / maxEnergy) * 100;
            energyBar.style.width = percent + '%';
        }

        function saveData() {
            localStorage.setItem('cc_score', score);
            localStorage.setItem('cc_energy', energy);
            localStorage.setItem('cc_maxEnergy', maxEnergy);
            localStorage.setItem('cc_clickPower', clickPower);
            localStorage.setItem('cc_clickPrice', clickPrice);
            localStorage.setItem('cc_energyPrice', energyPrice);
        }
    </script>
</body>
</html>
