<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator Web App</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #121212; color: #ffffff; display: flex; flex-direction: column; align-items: center; padding: 10px; }
        .header { width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #1e1e1e; border-radius: 8px; margin-bottom: 10px; }
        .logo { color: #ff3333; font-weight: bold; font-size: 20px; font-style: italic; }
        .balance { background: #2a2a2a; padding: 5px 10px; border-radius: 6px; font-size: 14px; color: #00ffcc; }
        .game-container { width: 100%; max-width: 400px; height: 220px; background: #1a1a1a; border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #333; margin-bottom: 10px; }
        .multiplier { font-size: 42px; font-weight: bold; }
        .bet-box { width: 100%; max-width: 400px; background: #1e1e1e; padding: 12px; border-radius: 12px; border: 1.5px solid #333; }
        .bet-input-group { display: flex; align-items: center; background: #121212; border-radius: 8px; padding: 10px; border: 1px solid #444; margin-bottom: 10px; }
        .bet-input-group input { background: transparent; border: none; color: #fff; font-size: 18px; width: 100%; outline: none; text-align: center; }
        .action-btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .btn-bet { background-color: #28a745; color: white; }
        .btn-cashout { background-color: #ff9900; color: white; display: none; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">Aviator</div>
        <div class="balance" id="balanceDisplay">1,000,000 UZS</div>
    </div>

    <div class="game-container">
        <div class="multiplier" id="multiplierDisplay">1.00x</div>
        <div id="statusText">Oʻyin boshlanishini kuting...</div>
    </div>

    <div class="bet-box">
        <div class="bet-input-group">
            <input type="number" id="betAmount" value="1000" min="1000" max="500000">
        </div>
        <button class="action-btn btn-bet" id="betBtn" onclick="placeBet()">Stavka qo'yish</button>
        <button class="action-btn btn-cashout" id="cashOutBtn" onclick="cashOut()">CASH OUT <span id="cashOutAmount">0</span> UZS</button>
    </div>

    <script>
        let balance = 1000000;
        let currentMultiplier = 1.00;
        let isPlaying = false;
        let hasBet = false;
        let currentBet = 0;
        let crashPoint = 1.00;

        const balanceDisplay = document.getElementById('balanceDisplay');
        const multiplierDisplay = document.getElementById('multiplierDisplay');
        const betBtn = document.getElementById('betBtn');
        const cashOutBtn = document.getElementById('cashOutBtn');
        const betInput = document.getElementById('betAmount');

        function updateBalance() { balanceDisplay.innerText = balance.toLocaleString() + " UZS"; }

        function startGameCycle() {
            if (isPlaying) return;
            let randomValue = Math.random();
            if (randomValue < 0.3) crashPoint = parseFloat((1.01 + Math.random() * 0.5).toFixed(2));
            else if (randomValue < 0.7) crashPoint = parseFloat((1.51 + Math.random() * 3.5).toFixed(2));
            else crashPoint = parseFloat((5.01 + Math.random() * 194.99).toFixed(2));

            currentMultiplier = 1.00;
            isPlaying = true;
            betBtn.style.display = hasBet ? "none" : "block";
            cashOutBtn.style.display = hasBet ? "block" : "none";

            let gameInterval = setInterval(() => {
                currentMultiplier += 0.01;
                multiplierDisplay.innerText = currentMultiplier.toFixed(2) + "x";
                if (hasBet) document.getElementById('cashOutAmount').innerText = Math.floor(currentBet * currentMultiplier).toLocaleString();
                if (currentMultiplier >= crashPoint) {
                    clearInterval(gameInterval);
                    endGame(false);
                }
            }, 50);
        }

        function placeBet() {
            let amount = parseInt(betInput.value);
            if (amount < 1000 || amount > 500000) { alert("Stavka 1,000 dan 500,000 gacha bo'lishi kerak!"); return; }
            if (amount > balance) { alert("Balansingizda yetarli mablag' yo'q!"); return; }
            
            balance -= amount;
            currentBet = amount;
            hasBet = true;
            updateBalance();
            betBtn.disabled = true;
            betBtn.innerText = "Kutilmoqda...";
        }

        function cashOut() {
            if (!hasBet || !isPlaying) return;
            let winAmount = Math.floor(currentBet * currentMultiplier);
            balance += winAmount;
            hasBet = false;
            updateBalance();
            endGame(true);
        }

        function endGame(isWon) {
            isPlaying = false;
            multiplierDisplay.innerText = crashPoint.toFixed(2) + "x";
            betBtn.style.display = "block";
            betBtn.disabled = false;
            betBtn.innerText = "Stavka qo'yish";
            cashOutBtn.style.display = "none";
            setTimeout(startGameCycle, 2000);
        }

        updateBalance();
        setTimeout(startGameCycle, 1500);
    </script>
</body>
</html>
