<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REDHAT PREDICTOR HACK</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            background: #090a0f; 
            color: white; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: space-between;
            min-height: 100vh; 
            padding: 20px 15px; 
        }

        .top-bar {
            width: 100%;
            max-width: 400px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #151922;
            padding: 12px 15px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .top-title {
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            color: #fff;
        }
        .close-btn { font-size: 18px; color: #aaa; cursor: pointer; }

        .neon-box {
            width: 100%;
            max-width: 400px;
            border: 2px solid #00ffff;
            border-radius: 14px;
            padding: 14px;
            text-align: center;
            background: rgba(0, 255, 255, 0.03);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2), inset 0 0 15px rgba(0, 255, 255, 0.1);
            margin: 15px 0;
        }
        .neon-box span {
            color: #00ffff;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.6);
        }

        .logo-section {
            text-align: center;
            margin: 10px 0;
        }
        .plane-logo {
            font-style: italic;
            font-weight: bold;
            font-size: 26px;
            color: #ff3333;
            text-shadow: 0 0 10px rgba(255,0,0,0.6);
        }
        .hack-title {
            color: #00ffff;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-top: 5px;
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
        }
        .user-id {
            font-size: 13px;
            color: #888;
            margin-top: 5px;
        }
        .user-id b { color: #fff; }

        .circle-container {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: radial-gradient(circle, rgba(15,20,35,0.8) 0%, rgba(5,8,15,1) 80%);
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            margin: 15px auto;
        }
        .circle-container::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid transparent;
            border-top-color: #00ffff;
            border-right-color: #ff00ff;
            border-bottom-color: #00ff00;
            border-left-color: #ffff00;
            animation: rotateGlow 4s linear infinite;
        }
        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result-coef {
            font-size: 38px;
            font-weight: bold;
            color: #ffffff;
            z-index: 2;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        .start-btn {
            background: linear-gradient(180deg, #2b73ff, #1345bc);
            border: 1px solid #5090ff;
            width: 100%;
            max-width: 400px;
            padding: 16px;
            color: white;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(43, 115, 255, 0.4);
            transition: 0.1s;
            margin-top: 15px;
            letter-spacing: 0.5px;
        }
        .start-btn:active {
            transform: scale(0.97);
            background: linear-gradient(180deg, #205ecc, #0f379a);
        }
    </style>
</head>
<body>

    <!-- Token saqlanadigan yashirin joy -->
    <script>

    </script>

    <div class="top-bar">
        <span class="close-btn" onclick="window.Telegram.WebApp.close()">✕</span>
        <span class="top-title">REDHAT PREDICTOR...</span>
        <span style="font-size: 16px; color: #aaa;">⋮</span>
    </div>

    <div class="neon-box">
        <span>AVIATOR PREDICTOR</span>
    </div>

    <div class="logo-section">
        <div class="plane-logo">Aviator</div>
        <div class="hack-title">HACK</div>
        <div class="user-id" id="userInfo">Logged in as: User - <b>33XXXX369</b></div>
    </div>

    <div class="circle-container">
        <div class="result-coef" id="coefDisplay">0.00x</div>
    </div>

    <button class="start-btn" id="startBtn" onclick="startSignal()">Start Signal</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            let uid = tg.initDataUnsafe.user.id.toString();
            let maskedId = uid.slice(0, 2) + "XXXX" + uid.slice(-3);
            document.getElementById('userInfo').innerHTML = `Logged in as: User - <b>${maskedId}</b>`;
        }

        function startSignal() {
            let btn = document.getElementById('startBtn');
            let coefDisplay = document.getElementById('coefDisplay');
            
            btn.disabled = true;
            coefDisplay.innerText = "⏳...";
            coefDisplay.style.fontSize = "28px";

            setTimeout(() => {
                // Sen so'ragan va rasmga mos koeffitsiyentlar bazasi
                const signals = [
                    "1.89x", "1.00x", "8.90x", "12.83x", "1.80x", "4.12x", 
                    "2.14x", "1.45x", "5.80x", "1.20x", "15.40x", "3.25x",
                    "1.02x", "6.50x", "2.45x", "1.15x", "9.12x", "1.98x"
                ];

                let randomSignal = signals[Math.floor(Math.random() * signals.length)];

                coefDisplay.innerText = randomSignal;
                coefDisplay.style.fontSize = "38px";
                btn.disabled = false;
            }, 2000);
        }
    </script>
</body>
</html>
