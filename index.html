<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallets - Hisobni To'ldirish</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #0f172a);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
        }
        .card-box {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
        }
        .humo-logo {
            font-size: 20px;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        .card-number {
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 2px;
            margin: 10px 0;
            color: #f8fafc;
        }
        .card-holder {
            font-size: 14px;
            opacity: 0.7;
            text-transform: uppercase;
        }
        .form-group {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 15px;
        }
        label {
            font-size: 13px;
            opacity: 0.8;
            display: block;
            margin-bottom: 6px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.2);
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }
        .limits {
            font-size: 12px;
            opacity: 0.6;
            margin-top: 5px;
        }
        .btn {
            background-color: var(--tg-theme-button-color, #38bdf8);
            color: var(--tg-theme-button-text-color, #0f172a);
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            margin-top: 5px;
        }
        .btn:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card-box">
            <div class="humo-logo">HUMO CARD</div>
            <div class="card-number">9860 6067 5865 7385</div>
            <div class="card-holder">Xolboyeva S.</div>
        </div>

        <div class="form-group">
            <label for="amount">Summani kiriting (UZS):</label>
            <input type="number" id="amount" placeholder="Masalan: 50000">
            <div class="limits">Min: 1,000 UZS | Max: 100,000 UZS</div>
        </div>

        <div class="form-group">
            <label for="receipt">To'lov chekini yuklash (Skrinshot):</label>
            <input type="file" id="receipt" accept="image/*">
        </div>

        <button class="btn" onclick="submitTopUp()">📥 Hisobni To'ldirish</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function submitTopUp() {
            let amount = document.getElementById('amount').value;
            let receiptFile = document.getElementById('receipt').files.length;

            if (!amount || amount < 1000 || amount > 100000) {
                tg.showAlert("❌ Xatolik! Summa 1,000 UZS dan 100,000 UZS gacha bo'lishi kerak.");
                return;
            }

            if (receiptFile === 0) {
                tg.showAlert("❌ Iltimos, to'lov cheki skrinshotini yuklang!");
                return;
            }

            tg.showAlert(`✅ Muvaffaqiyatli! ${amount} so'm uchun to'lov so'rovi yuborildi. Tekshirilmoqda...`);
        }
    </script>
</body>
</html>
