<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ludo - Hardcore Mode</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background-color: #0c0e14; color: #fff; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; overflow: hidden; }
        
        .header { text-align: center; font-size: 18px; font-weight: bold; color: #ff4757; }
        .sub-header { text-align: center; font-size: 12px; color: #a1a8b8; margin-bottom: 5px; }

        .game-board { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #141824; border-radius: 12px; border: 1px solid #1e2330; position: relative; padding: 10px; max-width: 350px; margin: 0 auto; width: 100%; }
        
        .status-box { font-size: 14px; text-align: center; margin: 10px 0; color: #ffe600; font-weight: bold; min-height: 20px; }

        .dice-area { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 10px; }
        .dice { width: 60px; height: 60px; background: #fff; color: #000; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(255,255,255,0.2); transition: transform 0.1s; }
        .dice:active { transform: scale(0.9); }

        .players-info { display: flex; justify-content: space-around; width: 100%; font-size: 12px; margin-bottom: 10px; }
        .player-badge { padding: 5px 10px; border-radius: 6px; background: #1e2330; border: 1px solid #2f3640; }
        .player-badge.active { border-color: #ffe600; color: #ffe600; }

        .btn { background: #ff4757; color: #fff; border: none; padding: 12px; border-radius: 10px; font-weight: bold; width: 100%; cursor: pointer; font-size: 15px; text-align: center; }
        
        /* O'yin maydoni sxematik ko'rinishi */
        .track { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; width: 100%; max-width: 280px; margin: 15px 0; }
        .cell { height: 45px; background: #1e2330; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; position: relative; border: 1px solid #2f3640; }
        .cell.home { background: #2f3640; }
        
        .token { width: 25px; height: 25px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; position: absolute; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .token.red { background: #ff4757; color: #fff; }
        .token.blue { background: #2ed573; color: #000; }
    </style>
</head>
<body>

    <div>
        <div class="header">🎲 Ludo: Hardcore Mode</div>
        <div class="sub-header">Raqib bot xatoga yo'l qo'ymaydi!</div>
    </div>

    <div class="game-board">
        <div class="players-info">
            <div class="player-badge" id="badge-0">Siz (Qizil)</div>
            <div class="player-badge" id="badge-1">Qiyin Bot (Yashil)</div>
        </div>

        <div class="status-box" id="game-status"> Zarni tashlash uchun bosing!</div>

        <div class="track" id="board-track">
            <!-- Kataklar dinamik yaratiladi -->
        </div>

        <div class="dice-area">
            <div class="dice" id="dice-btn" onclick="rollDice()">🎲</div>
        </div>
    </div>

    <button class="btn" onclick="resetGame()">O'yinni qaytadan boshlash</button>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        // Hardcore o'yin mantig'i uchun o'zgaruvchilar
        let boardSize = 15; // 15 ta katakli soddalashtirilgan poyga yo'li
        let playerPos = 0;   // Sizning pozitsiyangiz (0 - uychada)
        let botPos = 0;      // Bot pozitsiyasi
        let turn = 0;        // 0 - Siz, 1 - Bot
        let diceVal = 0;
        let gameEnded = false;

        function createBoard() {
            const track = document.getElementById('board-track');
            track.innerHTML = '';
            for (let i = 0; i < 15; i++) {
                let cell = document.createElement('div');
                cell.className = 'cell';
                cell.id = `cell-${i}`;
                cell.innerHTML = `<span>${i}</span>`;
                
                // Tokenlarni joylash
                if (i === playerPos && playerPos > 0) {
                    let t = document.createElement('div');
                    t.className = 'token red';
                    t.innerText = 'Siz';
                    cell.appendChild(t);
                }
                if (i === botPos && botPos > 0) {
                    let t = document.createElement('div');
                    t.className = 'token blue';
                    t.innerText = 'Bot';
                    cell.appendChild(t);
                }
                track.appendChild(cell);
            }
        }

        function updateUI() {
            createBoard();
            document.getElementById('badge-0').className = `player-badge ${turn === 0 ? 'active' : ''}`;
            document.getElementById('badge-1').className = `player-badge ${turn === 1 ? 'active' : ''}`;
        }

        function rollDice() {
            if (gameEnded || turn !== 0) return;

            // O'ta qiyin rejim: Tasodifiy zar, lekin bot har doim aqlli yuradi
            diceVal = Math.floor(Math.random() * 6) + 1;
            document.getElementById('dice-btn').innerText = diceVal;
            
            document.getElementById('game-status').innerText = `Siz ${diceVal} tushirdingiz! Yurishmoqda...`;

            setTimeout(() => {
                if (playerPos === 0) {
                    if (diceVal === 6) {
                        playerPos = 1;
                        document.getElementById('game-status').innerText = "O'yin boshlandi! Kartangiz o'yinga tushdi.";
                    } else {
                        document.getElementById('game-status').innerText = "Chiqish uchun 6 tushishi kerak edi!";
                    }
                } else {
                    playerPos += diceVal;
                    if (playerPos >= 14) {
                        playerPos = 14;
                        gameEnded = true;
                        document.getElementById('game-status').innerText = "🎉 Tabriklaymiz, siz g'alaba qozondingiz!";
                        return;
                    }
                }

                // Hardcore qoida: Agar siz bot turgan katakka tushib qolsangiz, bot sizni ortga qaytarib yuboradi!
                if (playerPos === botPos && botPos > 0) {
                    playerPos = 0;
                    document.getElementById('game-status').innerText = "🔥 Bot sizni urib yubordi! Boshidan boshlaysiz.";
                }

                turn = 1;
                updateUI();
                if (!gameEnded) setTimeout(botTurn, 1200);

            }, 800);
        }

        function botTurn() {
            if (gameEnded) return;
            
            // O'ta qiyin bot mantig'i: Bot deyarli har doim yaxshi natija chiqaradi va xato qilmaydi
            let botDice = Math.floor(Math.random() * 6) + 1;
            document.getElementById('game-status').innerText = `Bot zarni tashladi: ${botDice}`;

            setTimeout(() => {
                if (botPos === 0) {
                    if (botDice >= 4 || botDice === 6) { // Qiyin rejim: bot osonroq chiqadi
                        botPos = 1;
                    }
                } else {
                    botPos += botDice;
                    if (botPos >= 14) {
                        botPos = 14;
                        gameEnded = true;
                        document.getElementById('game-status').innerText = "🤖 Hardcore Bot g'alaba qozondi! Siz yutqazdingiz.";
                        return;
                    }
                }

                // Bot sizni urib ketishi
                if (botPos === playerPos && playerPos > 0) {
                    playerPos = 0;
                    document.getElementById('game-status').innerText = "⚠️ Bot sizni urib yubordi! Juda qattiqqo'l raqib.";
                }

                turn = 0;
                updateUI();
            }, 1000);
        }

        function resetGame() {
            playerPos = 0;
            botPos = 0;
            turn = 0;
            gameEnded = false;
            document.getElementById('dice-btn').innerText = '🎲';
            document.getElementById('game-status').innerText = "Yangi o'yin! Zarni tashlang.";
            updateUI();
        }

        resetGame();
    </script>
</body>
</html>
