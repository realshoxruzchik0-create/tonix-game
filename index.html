<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallets - Shaxsiy Hamyon</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #0f172a);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
        }
        .balance {
            font-size: 32px;
            font-weight: bold;
            margin: 10px 0;
            color: #38bdf8;
        }
        .btn {
            background-color: var(--tg-theme-button-color, #38bdf8);
            color: var(--tg-theme-button-text-color, #0f172a);
            border: none;
            border-radius: 12px;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <h3>💳 Mening Hamyonim</h3>
            <div class="balance" id="balanceText">150,000 so'm</div>
            <p style="opacity: 0.6; font-size: 14px;">Asosiy balans</p>
        </div>

        <button class="btn" onclick="addMoney()">📥 Hisobni To'ldirish</button>
        <button class="btn" style="background-color: #34d399;" onclick="transferMoney()">💸 Pul O'tkazish</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let currentBalance = 150000;

        function addMoney() {
            currentBalance += 50000;
            document.getElementById('balanceText').innerText = currentBalance.toLocaleString() + " so'm";
            tg.showAlert("Hisobingizga 50,000 so'm qo'shildi!");
        }

        function transferMoney() {
            tg.showAlert("Pul o'tkazish bo'limi ochilmoqda...");
        }
    </script>
</body>
</html>
