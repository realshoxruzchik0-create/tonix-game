<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Shashka O'yini</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .header {
            margin-bottom: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #38bdf8;
            text-align: center;
        }
        .score-board {
            display: flex;
            justify-content: space-between;
            width: 320px;
            margin-bottom: 10px;
            font-size: 14px;
            background: #1e293b;
            padding: 8px 15px;
            border-radius: 8px;
        }
        .board {
            width: 320px;
            height: 320px;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            border: 4px solid #334155;
            border-radius: 4px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .cell {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .light {
            background-color: #f1f5f9;
        }
        .dark {
            background-color: #475569;
        }
        .piece {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 2;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }
        .piece:active {
            transform: scale(0.9);
        }
        .white-piece {
            background: radial-gradient(circle at 30% 30%, #ffffff, #cbd5e1);
            border: 2px solid #94a3b8;
        }
        .black-piece {
            background: radial-gradient(circle at 30% 30%, #334155, #0f172a);
            border: 2px solid #000000;
        }
        .selected {
            box-shadow: 0 0 0 3px #38bdf8, 0 4px 6px rgba(0,0,0,0.3);
        }
        .highlight::after {
            content: '';
            width: 14px;
            height: 14px;
            background-color: #38bdf8;
            border-radius: 50%;
            position: absolute;
            z-index: 3;
            cursor: pointer;
        }
        .status-msg {
            margin-top: 15px;
            font-size: 14px;
            color: #94a3b8;
        }
        .btn-restart {
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">🤖 Telegram Shashka Boti</div>
    
    <div class="score-board">
        <div>Siz (Oq): <span id="white-count">12</span></div>
        <div>Bot (Qora): <span id="black-count">12</span></div>
    </div>

    <div class="board" id="board"></div>

    <div class="status-msg" id="status">Sizning navbatingiz (Oq toshlar)</div>
    <button class="btn-restart" onclick="initGame()">Qaytadan boshlash</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let board = [];
        let turn = 'white'; // 'white' - o'yinchi, 'black' - bot
        let selectedPiece = null;
        let whiteCount = 12;
        let blackCount = 12;

        function initGame() {
            board = [];
            whiteCount = 12;
            blackCount = 12;
            turn = 'white';
            selectedPiece = null;

            for (let r = 0; r < 8; r++) {
                board[r] = [];
                for (let c = 0; c < 8; c++) {
                    if ((r + c) % 2 === 1) {
                        if (r < 3) board[r][c] = 'black';
                        else if (r > 4) board[r][c] = 'white';
                        else board[r][c] = null;
                    } else {
                        board[r][c] = null;
                    }
                }
            }
            updateScore();
            renderBoard();
        }

        function renderBoard() {
            const boardElement = document.getElementById('board');
            boardElement.innerHTML = '';

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const cell = document.createElement('div');
                    cell.className = `cell ${(r + c) % 2 === 1 ? 'dark' : 'light'}`;
                    cell.dataset.row = r;
                    cell.dataset.col = c;

                    if (board[r][c]) {
                        const piece = document.createElement('div');
                        piece.className = `piece ${board[r][c] === 'white' ? 'white-piece' : 'black-piece'}`;
                        
                        if (selectedPiece && selectedPiece.r === r && selectedPiece.col === c) {
                            piece.classList.add('selected');
                        }
                        
                        cell.appendChild(piece);
                    }

                    // Yurish mumkin bo'lgan joylarni belgilash
                    if (selectedPiece && selectedPiece.moves) {
                        let move = selectedPiece.moves.find(m => m.r === r && m.col === c);
                        if (move) {
                            cell.classList.add('highlight');
                            cell.onclick = () => makeMove(move);
                        }
                    }

                    if (board[r][c] === 'white' && turn === 'white') {
                        cell.onclick = () => selectPiece(r, c);
                    }

                    boardElement.appendChild(cell);
                }
            }
        }

        function selectPiece(r, c) {
            selectedPiece = { r, col: c, moves: getValidMoves(r, c, 'white') };
            renderBoard();
        }

        function getValidMoves(r, c, player) {
            let moves = [];
            let dir = player === 'white' ? -1 : 1;
            
            // Oddiy yurishlar
            let leftCol = c - 1;
            let rightCol = c + 1;
            let nextR = r + dir;

            [leftCol, rightCol].forEach(nc => {
                if (nextR >= 0 && nextR < 8 && nc >= 0 && nc < 8) {
                    if (!board[nextR][nc]) {
                        moves.push({ r: nextR, col: nc, type: 'move' });
                    } else if (board[nextR][nc] !== player) {
                        // Urib o'tish (atrabotka)
                        let jumpR = nextR + dir;
                        let jumpC = nc + (nc > c ? 1 : -1);
                        if (jumpR >= 0 && jumpR < 8 && jumpC >= 0 && jumpC < 8 && !board[jumpR][jumpC]) {
                            moves.push({ r: jumpR, col: jumpC, type: 'jump', targetR: nextR, targetC: nc });
                        }
                    }
                }
            });
            return moves;
        }

        function makeMove(move) {
            let r = selectedPiece.r;
            let c = selectedPiece.col;

            board[move.r][move.col] = board[r][c];
            board[r][c] = null;

            if (move.type === 'jump') {
                board[move.targetR][move.targetC] = null;
                if (turn === 'white') blackCount--;
                else whiteCount--;
            }

            selectedPiece = null;
            updateScore();
            renderBoard();

            if (whiteCount === 0 || blackCount === 0) {
                alert(whiteCount === 0 ? "Bot g'alaba qozondi!" : "Siz g'alaba qozondingiz!");
                initGame();
                return;
            }

            turn = turn === 'white' ? 'black' : 'white';
            if (turn === 'black') {
                document.getElementById('status').innerText = "Bot yurmoqda...";
                setTimeout(botMove, 800);
            } else {
                document.getElementById('status').innerText = "Sizning navbatingiz (Oq toshlar)";
            }
        }

        function botMove() {
            // Botning oddiy yurish mantiqi
            let blackPieces = [];
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    if (board[r][c] === 'black') {
                        let moves = getValidMoves(r, c, 'black');
                        if (moves.length > 0) {
                            blackPieces.push({ r, c, moves });
                        }
                    }
                }
            }

            if (blackPieces.length > 0) {
                let randomPiece = blackPieces[Math.floor(Math.random() * blackPieces.length)];
                let randomMove = randomPiece.moves[Math.floor(Math.random() * randomPiece.moves.length)];

                board[randomMove.r][randomMove.col] = 'black';
                board[randomPiece.r][randomPiece.col] = null;

                if (randomMove.type === 'jump') {
                    board[randomMove.targetR][randomMove.targetC] = null;
                    whiteCount--;
                }
            }

            updateScore();
            renderBoard();

            if (whiteCount === 0) {
                alert("Bot g'alaba qozondi!");
                initGame();
                return;
            }

            turn = 'white';
            document.getElementById('status').innerText = "Sizning navbatingiz (Oq toshlar)";
        }

        function updateScore() {
            document.getElementById('white-count').innerText = whiteCount;
            document.getElementById('black-count').innerText = blackCount;
        }

        initGame();
    </script>
</body>
</html>
