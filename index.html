<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voice Coins Market</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background-color: #0c0e14; color: #fff; padding: 15px; display: flex; flex-direction: column; min-height: 100vh; justify-content: space-between; }
        
        /* Balans kartochkasi */
        .balance-card { background: linear-gradient(135deg, #2563eb, #1d4ed8); border-radius: 24px; padding: 22px; margin-bottom: 20px; box-shadow: 0 10px 25px rgba(37,99,235,0.35); }
        .balance-title { font-size: 14px; color: #cbd5e1; margin-bottom: 8px; font-weight: 400; }
        
        .balance-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 20px; }
        .balance-amount { font-size: 38px; font-weight: bold; color: #fff; line-height: 1; }
        .balance-currency { font-size: 20px; font-weight: 500; color: #cbd5e1; }
        
        .balance-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .action-btn { background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 16px; padding: 12px 6px; color: #fff; font-size: 11px; text-align: center; cursor: pointer; font-weight: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; transition: 0.2s; }
        .action-btn span { font-size: 20px; }
        .action-btn:active { background: rgba(255, 255, 255, 0.25); transform: scale(0.96); }

        /* Ilovalar setkasi */
        .section-title { font-size: 15px; font-weight: bold; margin-bottom: 12px; color: #f8fafc; }
        .apps-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
        
        .app-card { background: #141824; border: 1px solid #1e2330; border-radius: 16px; padding: 12px 8px; text-align: center; cursor: pointer; position: relative; display: flex; flex-direction: column; align-items: center; transition: 0.2s; }
        .app-card:active { transform: scale(0.95); border-color: #2563eb; }
        
        .app-icon { width: 50px; height: 50px; border-radius: 12px; background: #1e2330; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; overflow: hidden; }
        .app-icon img { width: 100%; height: 100%; object-fit: cover; }
        
        .app-name { font-size: 12px; font-weight: 600; color: #f1f5f9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
        .app-badge { position: absolute; top: 8px; right: 8px; font-size: 9px; background: #1e293b; color: #38bdf8; padding: 2px 5px; border-radius: 6px; font-weight: bold; }

        /* Modal oyna */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 100; }
        .modal-content { background: #141824; border: 1px solid #1e2330; width: 100%; max-width: 340px; border-radius: 20px; padding: 20px; position: relative; }
        .modal-title { font-size: 18px; font-weight: bold; margin-bottom: 15px; text-align: center; color: #38bdf8; }
        
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 10px; background: #0c0e14; border: 1px solid #1e2330; border-radius: 10px; color: #fff; font-size: 14px; outline: none; }
        
        .packages-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 15px; }
        .pkg-item { background: #0c0e14; border: 1px solid #1e2330; border-radius: 10px; padding: 10px; text-align: center; cursor: pointer; }
        .pkg-item.selected { border-color: #38bdf8; background: #1e293b; }
        .pkg-coins { font-size: 13px; font-weight: bold; color: #f8fafc; }
        .pkg-price { font-size: 11px; color: #94a3b8; margin-top: 3px; }

        .btn { background: #2563eb; color: #fff; border: none; padding: 12px; border-radius: 12px; font-weight: bold; width: 100%; cursor: pointer; font-size: 14px; }
        .close-btn { position: absolute; top: 15px; right: 15px; background: none; border: none; color: #94a3b8; font-size: 18px; cursor: pointer; }
    </style>
</head>
<body>

    <div>
        <div class="balance-card">
            <div class="balance-title">Balans</div>
            <div class="balance-row">
                <div class="balance-amount">0</div>
                <div class="balance-currency">so'm</div>
            </div>
            <div class="balance-actions">
                <button class="action-btn" onclick="alert('Tez kunda!')">
                    <span>💳</span> Hisobni to'ldirish
                </button>
                <button class="action-btn" onclick="alert('Bonus kodlar mavjud emas')">
                    <span>🎁</span> Bonus kodlar
                </button>
                <button class="action-btn" onclick="alert('Admin bilan bog\'lanish')">
                    <span>💬</span> Qo'llab-quvvatlash
                </button>
            </div>
        </div>

        <div class="section-title">Ovozli chat va efir ilovalari</div>
        <div class="apps-grid" id="apps-container"></div>
    </div>

    <!-- Buyurtma oynasi -->
    <div class="modal" id="orderModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">✕</button>
            <div class="modal-title" id="modal-app-title">Poppo Live</div>
            
            <div class="form-group">
                <label>Foydalanuvchi ID (User ID):</label>
                <input type="number" id="userid" placeholder="ID raqamni kiriting">
            </div>

            <div class="form-group">
                <label>Paketni tanlang:</label>
                <div class="packages-grid" id="packages-list"></div>
            </div>

            <button class="btn" onclick="submitOrder()">Sotib olish 🚀</button>
        </div>
    </div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        // Barcha 9 ta ilovaning o'zingiz bergan haqiqiy rasm linklari:
        const apps = [
            { 
                name: "Poppo Live", 
                icon: "https://radare.arzfun.com/api/tg/photo?id=AgACAgEAAxkBAAENNVpqsVO8NIJZo...a52nrfimykeiPRYFAACKwxrG8I7kUXAgA1veqUjweAAwIAA3kAAz0E", 
                badge: "Global" 
            },
            { 
                name: "We Party", 
                icon: "https://radare.arzfun.com/api/tg/photo?id=AgACAgEAAxkBAAENNV1qsVQBWqj7a_4QE9wwlTbrTiU97QACIAxrG8I7kUVq80ofclpC1QEAAwiAA3kAAz0E", 
                badge: "Popular" 
            },
            { 
                name: "Bigo Live", 
                icon: "https://radare.arzfun.com/api/tg/photo?id=AgACAgEAAxkBAAENNWBqsVQ-CVix4oKJOnpw0BMAAUbE2BcApUMaxvCO5FF6G5FkNCYEY0BAAMCAAN5AAM9BA", 
                badge: "Global" 
            },
            { 
                name: "Tigo Live", 
                icon: "https://radare.arzfun.com/api/tg/photo?id=AgACAgEAAxkBAAENNWNqsVSYt3hhRV1okV1Sexe5-oMRiwAClg-R8I7kUWHetgLia8X1wEAAwIAA3kAAz0E", 
                badge: "Hot" 
            },
            { 
                name: "Yalla", 
                icon: "https://radare.arzfun.com/api/tg/photo?id=AgACAgEAAxkBAAENNWZqsVSwCRw5_JwHulo5onfZW2n8jgACIwxrG8I7kUUWsDILB0eVJAEAAwiAA3kAAz0E", 
                badge: "Voice" 
            },
            { 
                name: "Hago", 
                icon: "https://radare.arzfun.com/api/tg/photo?id=AgACAgEAAxkBAAENNWlqsVUfu3Bu7iHjBGy7TCh4RKUXVwACmaxrG8I7kUXpZM8LXBKddQEAAwiAA3kAAz0E", 
                badge: "Game" 
            },
            { 
                name: "SuGO", 
                icon: "https://radare.arzfun.com/api/tg/photo?id=AgACAgEAAxkBAAENNWxqsVU1rzXvHnD6pDnaRnCSE0fKLAACmQxrG8I7kUUHNmpxJkcaRAEAAwiAA3kAAz0E", 
                badge: "New" 
            },
            { 
                name: "TopTop", 
                icon: "https://radare.arzfun.com/api/tg/photo?id=AgACAgEAAxkBAAENNW9qsVVM0ALVSO1PjksoAAFIccnIT9gAApoMaxvCO5FFFloJaLu1-4QBAAMCAAN5AAM9BA", 
                badge: "Voice" 
            },
            { 
                name: "HayiChat", 
                icon: "https://radare.arzfun.com/api/tg/photo?id=AgACAgEAAxkBAAENNXJqsVWbSJJLM0MZTcAlvYZXDFSPfwACmwxrG8I7kUU8y36-WTsWKQEAAwiAA3kAAz0E", 
                badge: "Active" 
            }
        ];

        let selectedApp = "";
        let selectedPkg = { name: "10,000 Coins", price: "15,000 so'm" };
        const packagesData = [
            { name: "10,000 Coins", price: "15,000 so'm" },
            { name: "50,000 Coins", price: "70,000 so'm" },
            { name: "100,000 Coins", price: "135,000 so'm" },
            { name: "500,000 Coins", price: "650,000 so'm" }
        ];

        function renderApps() {
            const container = document.getElementById('apps-container');
            container.innerHTML = '';
            apps.forEach(app => {
                let card = document.createElement('div');
                card.className = 'app-card';
                card.onclick = () => openModal(app.name);
                card.innerHTML = `
                    <div class="app-badge">${app.badge}</div>
                    <div class="app-icon"><img src="${app.icon}" alt="${app.name}"></div>
                    <div class="app-name">${app.name}</div>
                `;
                container.appendChild(card);
            });
        }

        function openModal(appName) {
            selectedApp = appName;
            document.getElementById('modal-app-title').innerText = appName;
            document.getElementById('orderModal').style.display = 'flex';
            renderPackages();
        }

        function closeModal() { document.getElementById('orderModal').style.display = 'none'; }

        function renderPackages() {
            const container = document.getElementById('packages-list');
            container.innerHTML = '';
            packagesData.forEach((pkg, index) => {
                let item = document.createElement('div');
                item.className = `pkg-item ${index === 0 ? 'selected' : ''}`;
                item.onclick = () => {
                    document.querySelectorAll('.pkg-item').forEach(i => i.classList.remove('selected'));
                    item.classList.add('selected');
                    selectedPkg = pkg;
                };
                item.innerHTML = `<div class="pkg-coins">${pkg.name}</div><div class="pkg-price">${pkg.price}</div>`;
                container.appendChild(item);
            });
        }

        function submitOrder() {
            let userid = document.getElementById('userid').value;
            if (!userid) { alert("ID raqamingizni kiriting!"); return; }
            let data = { platform: selectedApp, userid: userid, package: selectedPkg.name, price: selectedPkg.price };
            if (window.Telegram && window.Telegram.WebApp) { window.Telegram.WebApp.sendData(JSON.stringify(data)); }
            else { alert(`Zakaz: ${selectedApp}, ID: ${userid}, Paket: ${selectedPkg.name}`); closeModal(); }
        }

        renderApps();
    </script>
</body>
</html>
