<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GeoFox Crash Game - Aviator</title>
  <style>
    :root {
      --bg-dark: #0e121b;
      --card-bg: #181f2c;
      --input-bg: #090c12;
      --accent-green: #00e676;
      --accent-red: #ff1744;
      --accent-orange: #ff9100;
      --text-main: #ffffff;
      --text-muted: #8899a6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; user-select: none; }
    body { background: var(--bg-dark); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
    
    /* SPLASH SCREEN */
    #splash-screen {
      position: fixed; inset: 0; background: #000; z-index: 9999;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      transition: opacity 0.6s ease;
    }
    .fox-logo-anim { width: 140px; height: 140px; position: relative; }
    .fox-logo-anim svg { width: 100%; height: 100%; filter: drop-shadow(0 0 15px rgba(0,230,118,0.8)); animation: pulse 1.5s infinite alternate; }
    @keyframes pulse { 0% { transform: scale(0.95); opacity: 0.7; } 100% { transform: scale(1.05); opacity: 1; } }
    .loading-text { margin-top: 20px; font-weight: bold; letter-spacing: 2px; color: var(--accent-green); font-size: 14px; }

    /* ONBOARDING MODAL */
    #onboarding-modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 9000;
      display: flex; justify-content: center; align-items: center; padding: 20px;
    }
    .modal-card {
      background: var(--card-bg); border-radius: 16px; padding: 24px; width: 100%; max-width: 360px;
      border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .modal-title { font-size: 20px; font-weight: bold; margin-bottom: 16px; text-align: center; color: var(--accent-green); }
    .input-group { margin-bottom: 14px; }
    .input-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
    .input-group input, .input-group select {
      width: 100%; padding: 12px; background: var(--input-bg); border: 1px solid #2a3447;
      border-radius: 8px; color: #fff; font-size: 14px; outline: none;
    }
    .btn-submit {
      width: 100%; padding: 14px; background: var(--accent-green); border: none; border-radius: 8px;
      color: #000; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 10px;
    }

    /* HEADER & TABS */
    header {
      background: #121824; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #1e2738;
    }
    .user-info { display: flex; align-items: center; gap: 8px; }
    .avatar { width: 32px; height: 32px; background: #2a3447; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: var(--accent-green); }
    .username-display { font-size: 13px; font-weight: bold; }
    .account-type { font-size: 10px; color: var(--accent-green); }
    .balance-box { display: flex; align-items: center; gap: 8px; }
    .balance-badge { background: #090c12; border: 1px solid #253147; padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 13px; color: var(--accent-green); }
    .btn-deposit { background: var(--accent-green); color: #000; border: none; padding: 6px 10px; border-radius: 8px; font-weight: bold; font-size: 12px; cursor: pointer; }

    /* HISTORY BAR */
    .history-bar {
      display: flex; gap: 6px; padding: 8px 12px; background: #0a0d14; overflow-x: auto; border-bottom: 1px solid #1a2233;
    }
    .history-chip {
      padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; background: #1c2638; color: #8fa0bd; flex-shrink: 0;
    }
    .history-chip.high { background: #6a1b9a; color: #e1bee7; }
    .history-chip.mid { background: #1565c0; color: #bbdefb; }

    /* GAME DISPLAY */
    .game-display {
      flex: 1; position: relative; background: radial-gradient(circle at center, #1b2436 0%, #090c12 100%);
      display: flex; justify-content: center; align-items: center; overflow: hidden;
    }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .multiplier-text { position: relative; z-index: 10; font-size: 48px; font-weight: 900; color: #fff; text-shadow: 0 0 20px rgba(255,255,255,0.4); }
    .status-text { position: relative; z-index: 10; font-size: 14px; font-weight: bold; color: var(--accent-red); margin-top: 8px; display: none; }

    /* BETTING PANELS */
    .controls-container {
      background: #111622; padding: 10px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; max-height: 45vh;
    }
    .bet-panel {
      background: var(--card-bg); border-radius: 12px; padding: 10px; border: 1px solid #232d3f;
    }
    .panel-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 12px; color: var(--text-muted); }
    .panel-body { display: flex; gap: 10px; }
    .left-inputs { flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .amount-input-box {
      display: flex; align-items: center; background: var(--input-bg); border-radius: 6px; border: 1px solid #283347; overflow: hidden;
    }
    .btn-step { width: 32px; height: 32px; background: #1a2333; border: none; color: #fff; font-size: 16px; cursor: pointer; }
    .amount-input-box input { flex: 1; background: transparent; border: none; color: #fff; text-align: center; font-weight: bold; outline: none; font-size: 13px; }
    .quick-chips { display: flex; gap: 4px; }
    .chip-btn { flex: 1; background: #1a2333; border: 1px solid #26334a; color: #9ab0d3; border-radius: 4px; font-size: 10px; padding: 4px 0; cursor: pointer; }

    .auto-toggles { display: flex; gap: 8px; font-size: 11px; align-items: center; margin-top: 4px; }
    .auto-input { width: 45px; background: var(--input-bg); border: 1px solid #283347; color: #fff; border-radius: 4px; text-align: center; font-size: 11px; padding: 2px; }

    /* ACTION BUTTONS */
    .btn-action {
      flex: 1; border: none; border-radius: 8px; font-weight: 900; text-transform: uppercase; cursor: pointer;
      display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px;
      font-size: 16px; transition: all 0.2s ease; min-height: 70px;
    }
    .btn-bet { background: #e53935; color: #fff; box-shadow: 0 4px 15px rgba(229,57,53,0.4); }
    .btn-cashout { background: var(--accent-orange); color: #000; box-shadow: 0 4px 15px rgba(255,145,0,0.5); }
    .btn-cancel { background: #757575; color: #fff; }
    .sub-payout { font-size: 11px; font-weight: normal; opacity: 0.9; }

    /* DEPOSIT MODAL */
    #deposit-modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 9500; display: none; justify-content: center; align-items: center; padding: 20px;
    }
  </style>
</head>
<body>

  <!-- SPLASH SCREEN ANIMATION -->
  <div id="splash-screen">
    <div class="fox-logo-anim">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 80L15 45L30 15L50 35L70 15L85 45L50 80Z" stroke="#00e676" stroke-width="4" fill="#090c12"/>
        <polygon points="50,45 35,25 50,35" fill="#00e676"/>
        <polygon points="50,45 65,25 50,35" fill="#00e676"/>
      </svg>
    </div>
    <div class="loading-text">GEOFOX AVIATOR...</div>
  </div>

  <!-- ONBOARDING REGISTRATION -->
  <div id="onboarding-modal">
    <div class="modal-card">
      <div class="modal-title">GEOFOX REJIMI</div>
      <div class="input-group">
        <label>Hisob turi:</label>
        <select id="acc-type-select">
          <option value="demo">Demo Hisob (100,000 SO'M)</option>
          <option value="real">Haqiqiy Hisob (Humo / Uzcard)</option>
        </select>
      </div>
      <div class="input-group">
        <label>Telefon raqamingiz:</label>
        <input type="text" id="user-phone" placeholder="+998 90 123 45 67" />
      </div>
      <div class="input-group">
        <label>Username (Nikingiz):</label>
        <input type="text" id="user-name" placeholder="Masalan: trader_777" />
      </div>
      <button class="btn-submit" onclick="finishOnboarding()">O'YINNI BOSHLASH 🚀</button>
    </div>
  </div>

  <!-- DEPOSIT MODAL -->
  <div id="deposit-modal">
    <div class="modal-card">
      <div class="modal-title">Balansni To'ldirish</div>
      <p style="font-size: 13px; color: var(--text-muted); text-align: center; margin-bottom: 16px;">
        Hisobni to'ldirish uchun quyidagi tugmani bosing va admin bilan bog'laning:
      </p>
      <button onclick="redirectToAdminCard()" class="btn-submit" style="background: var(--accent-green); color: #000; margin-bottom: 10px;">
        💳 Bank Karta
      </button>
      <button onclick="closeDepositModal()" class="btn-submit" style="background: #2a3447; color: #fff;">
        Yopish
      </button>
    </div>
  </div>

  <!-- HEADER -->
  <header>
    <div class="user-info">
      <div class="avatar" id="avatar-letter">G</div>
      <div>
        <div class="username-display" id="disp-username">@player</div>
        <div class="account-type" id="disp-acctype">DEMO</div>
      </div>
    </div>
    <div class="balance-box">
      <div class="balance-badge" id="disp-balance">100 000 UZS</div>
      <button class="btn-deposit" onclick="openDepositModal()">+</button>
    </div>
  </header>

  <!-- HISTORY MULTIPLIERS -->
  <div class="history-bar" id="history-bar">
    <div class="history-chip mid">2.73x</div>
    <div class="history-chip">1.15x</div>
    <div class="history-chip">1.77x</div>
    <div class="history-chip high">4.13x</div>
    <div class="history-chip">1.05x</div>
  </div>

  <!-- AVIATOR GAME DISPLAY -->
  <div class="game-display">
    <canvas id="crashCanvas"></canvas>
    <div style="text-align: center;">
      <div class="multiplier-text" id="mult-text">1.00x</div>
      <div class="status-text" id="status-text">UCHIB KETDI!</div>
    </div>
  </div>

  <!-- DUAL BET CONTROL PANELS -->
  <div class="controls-container">
    
    <!-- PANEL 1 -->
    <div class="bet-panel">
      <div class="panel-header">
        <span>Stavka #1</span>
        <div class="auto-toggles">
          <label><input type="checkbox" id="autobet-1"> Avto stavka</label>
          <label><input type="checkbox" id="autocash-1"> Avto keshaut</label>
          <input type="number" class="auto-input" id="autocash-val-1" value="2.00" step="0.1">x
        </div>
      </div>
      <div class="panel-body">
        <div class="left-inputs">
          <div class="amount-input-box">
            <button class="btn-step" onclick="adjustBet(1, -1000)">-</button>
            <input type="number" id="bet-amt-1" value="2000">
            <button class="btn-step" onclick="adjustBet(1, 1000)">+</button>
          </div>
          <div class="quick-chips">
            <button class="chip-btn" onclick="setBet(1, 50000)">50k</button>
            <button class="chip-btn" onclick="setBet(1, 100000)">100k</button>
            <button class="chip-btn" onclick="setBet(1, 200000)">200k</button>
          </div>
        </div>
        <button class="btn-action btn-bet" id="btn-action-1" onclick="handleAction(1)">
          <span>STAVKA</span>
          <span class="sub-payout" id="sub-1">2,000 SO'M</span>
        </button>
      </div>
    </div>

    <!-- PANEL 2 -->
    <div class="bet-panel">
      <div class="panel-header">
        <span>Stavka #2</span>
        <div class="auto-toggles">
          <label><input type="checkbox" id="autobet-2"> Avto stavka</label>
          <label><input type="checkbox" id="autocash-2"> Avto keshaut</label>
          <input type="number" class="auto-input" id="autocash-val-2" value="10.00" step="0.5">x
        </div>
      </div>
      <div class="panel-body">
        <div class="left-inputs">
          <div class="amount-input-box">
            <button class="btn-step" onclick="adjustBet(2, -1000)">-</button>
            <input type="number" id="bet-amt-2" value="3000">
            <button class="btn-step" onclick="adjustBet(2, 1000)">+</button>
          </div>
          <div class="quick-chips">
            <button class="chip-btn" onclick="setBet(2, 50000)">50k</button>
            <button class="chip-btn" onclick="setBet(2, 100000)">100k</button>
            <button class="chip-btn" onclick="setBet(2, 200000)">200k</button>
          </div>
        </div>
        <button class="btn-action btn-bet" id="btn-action-2" onclick="handleAction(2)">
          <span>STAVKA</span>
          <span class="sub-payout" id="sub-2">3,000 SO'M</span>
        </button>
      </div>
    </div>

  </div>

  <script>
    let balance = 100000;
    let gameState = 'waiting'; 
    let currentMultiplier = 1.00;
    let crashPoint = 2.00;

    let bets = {
      1: { active: false, cashed: false, amount: 2000 },
      2: { active: false, cashed: false, amount: 3000 }
    };

    setTimeout(() => {
      document.getElementById('splash-screen').style.opacity = '0';
      setTimeout(() => document.getElementById('splash-screen').style.display = 'none', 600);
    }, 2000);

    function finishOnboarding() {
      const name = document.getElementById('user-name').value || 'player_1';
      const accType = document.getElementById('acc-type-select').value;
      
      document.getElementById('disp-username').innerText = '@' + name;
      document.getElementById('avatar-letter').innerText = name[0].toUpperCase();
      document.getElementById('disp-acctype').innerText = accType.toUpperCase();
      document.getElementById('onboarding-modal').style.display = 'none';

      startRoundLoop();
    }

    function openDepositModal() {
      document.getElementById('deposit-modal').style.display = 'flex';
    }

    function closeDepositModal() {
      document.getElementById('deposit-modal').style.display = 'none';
    }

    function redirectToAdminCard() {
      const adminUsername = "TurayevaSabina";
      const message = encodeURIComponent("Assalomu Alaykum qaysi bank kartaga Pul tashay");
      const telegramUrl = `https://t.me/${adminUsername}?text=${message}`;
      
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.openTelegramLink(telegramUrl);
      } else {
        window.open(telegramUrl, '_blank');
      }
    }

    function startRoundLoop() {
      gameState = 'waiting';
      document.getElementById('mult-text').style.color = '#fff';
      document.getElementById('mult-text').innerText = 'KUTING...';
      document.getElementById('status-text').style.display = 'none';

      setTimeout(() => {
        gameState = 'running';
        currentMultiplier = 1.00;
        crashPoint = (Math.random() * 5 + 1.05).toFixed(2);
        
        [1, 2].forEach(p => {
          if(document.getElementById(`autobet-${p}`).checked && !bets[p].active) {
            placeBet(p);
          }
        });

        runMultiplier();
      }, 3000);
    }

    function runMultiplier() {
      if (gameState !== 'running') return;

      currentMultiplier += 0.015 * (currentMultiplier * 0.5);
      document.getElementById('mult-text').innerText = currentMultiplier.toFixed(2) + 'x';

      [1, 2].forEach(p => {
        if (bets[p].active && !bets[p].cashed) {
          const autoVal = parseFloat(document.getElementById(`autocash-val-${p}`).value);
          if (document.getElementById(`autocash-${p}`).checked && currentMultiplier >= autoVal) {
            cashout(p);
          } else {
            const winAmt = Math.floor(bets[p].amount * currentMultiplier);
            document.getElementById(`btn-action-${p}`).innerHTML = `<span>OBNALICHIT</span><span class="sub-payout">${winAmt} SO'M</span>`;
          }
        }
      });

      if (currentMultiplier >= crashPoint) {
        gameState = 'crashed';
        document.getElementById('mult-text').style.color = 'var(--accent-red)';
        document.getElementById('status-text').style.display = 'block';

        const chip = document.createElement('div');
        chip.className = 'history-chip ' + (crashPoint > 3 ? 'high' : 'mid');
        chip.innerText = crashPoint + 'x';
        document.getElementById('history-bar').prepend(chip);

        [1, 2].forEach(p => {
          if (bets[p].active && !bets[p].cashed) {
            bets[p].active = false;
            resetBtn(p);
          }
        });

        setTimeout(startRoundLoop, 4000);
      } else {
        requestAnimationFrame(runMultiplier);
      }
    }

    function handleAction(p) {
      if (!bets[p].active && gameState !== 'crashed') {
        placeBet(p);
      } else if (bets[p].active && !bets[p].cashed && gameState === 'running') {
        cashout(p);
      }
    }

    function placeBet(p) {
      const amt = parseInt(document.getElementById(`bet-amt-${p}`).value);
      if (balance >= amt) {
        balance -= amt;
        updateBalance();
        bets[p].active = true;
        bets[p].cashed = false;
        bets[p].amount = amt;
        
        const btn = document.getElementById(`btn-action-${p}`);
        btn.className = 'btn-action btn-cancel';
        btn.innerHTML = `<span>OTMENA</span><span class="sub-payout">${amt} SO'M</span>`;
      }
    }

    function cashout(p) {
      bets[p].cashed = true;
      const win = Math.floor(bets[p].amount * currentMultiplier);
      balance += win;
      updateBalance();

      const btn = document.getElementById(`btn-action-${p}`);
      btn.className = 'btn-action btn-cashout';
      btn.innerHTML = `<span>YUTINGIZ!</span><span class="sub-payout">+${win} SO'M</span>`;
    }

    function resetBtn(p) {
      const btn = document.getElementById(`btn-action-${p}`);
      btn.className = 'btn-action btn-bet';
      btn.innerHTML = `<span>STAVKA</span><span class="sub-payout" id="sub-${p}">${bets[p].amount} SO'M</span>`;
    }

    function updateBalance() {
      document.getElementById('disp-balance').innerText = balance.toLocaleString() + ' UZS';
    }

    function setBet(p, val) {
      document.getElementById(`bet-amt-${p}`).value = val;
      bets[p].amount = val;
      if (!bets[p].active) resetBtn(p);
    }

    function adjustBet(p, delta) {
      const input = document.getElementById(`bet-amt-${p}`);
      let newVal = Math.max(1000, parseInt(input.value) + delta);
      input.value = newVal;
      bets[p].amount = newVal;
      if (!bets[p].active) resetBtn(p);
    }
  </script>
</body>
</html>
