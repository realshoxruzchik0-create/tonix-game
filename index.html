<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>AFTARITET 26</title>
    <style>
        body { background: #000; color: #fff; margin: 0; font-family: sans-serif; overflow: hidden; }
        .screen { display: none; height: 100vh; flex-direction: column; align-items: center; justify-content: center; }
        .active { display: flex; }
        #tapCircle { width: 250px; height: 250px; background: radial-gradient(#333, #000); border-radius: 50%; border: 5px solid #ff4500; cursor: pointer; }
        .nav-bar { position: fixed; bottom: 0; width: 100%; display: flex; justify-content: space-around; background: #1a1a1a; padding: 15px; }
    </style>
</head>
<body>

<!-- 1. OBUNA OYNASI -->
<div id="subScreen" class="screen active">
    <img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png" width="100">
    <h2>AFTARITET 26 ga xush kelibsiz!</h2>
    <a href="https://www.youtube.com/@JanobAvtoritetGame" class="btn">YouTube ga obuna bo'lish</a>
    <button onclick="checkSub()">Tasdiqlash va Kirish</button>
</div>

<!-- 2. O'YIN HUDUDI -->
<div id="gameScreen" class="screen">
    <div id="tapCircle" onclick="tap()"></div>
    <h2 id="cashDisplay">Cash: 0$</h2>
    <div class="nav-bar">
        <div onclick="show('market')">Market</div>
        <div onclick="show('lobby')">Lobby</div>
        <div onclick="show('battle')">Battle</div>
    </div>
</div>

<script>
    let cash = 0, isSubscribed = false;
    const clickSound = new Audio('https://www.soundjay.com/buttons/sounds/button-16.mp3');

    function checkSub() {
        // Bu yerda obuna tekshiruv logikasi bo'ladi
        isSubscribed = true; 
        document.getElementById('subScreen').classList.remove('active');
        document.getElementById('gameScreen').classList.add('active');
    }

    function tap() {
        clickSound.play();
        cash += 1;
        document.getElementById('cashDisplay').innerText = "Cash: " + cash + "$";
    }

    function show(tab) {
        // Market, Lobby va Battle bo'limlari uchun kod
        alert(tab + " bo'limi hali tayyorlanmoqda!");
    }
</script>
</body>
</html>
