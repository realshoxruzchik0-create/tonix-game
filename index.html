<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UzTube Web App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --text-color: #ffffff;
            --secondary-text: #aaa;
            --card-bg: #212121;
            --red-color: #ff0000;
        }
        body {
            font-family: Roboto, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding-bottom: 70px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background-color: var(--bg-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: bold;
            font-size: 20px;
        }
        .logo span {
            background-color: var(--red-color);
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
        }
        .header-icons {
            display: flex;
            gap: 20px;
            font-size: 20px;
            cursor: pointer;
        }
        .chips-container {
            display: flex;
            gap: 10px;
            padding: 10px 15px;
            overflow-x: auto;
            white-space: nowrap;
            background-color: var(--bg-color);
            scrollbar-width: none;
        }
        .chips-container::-webkit-scrollbar { display: none; }
        .chip {
            background-color: #272727;
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            border: none;
        }
        .chip.active {
            background-color: white;
            color: black;
        }
        .page {
            display: none;
            padding: 15px;
        }
        .page.active {
            display: block;
        }
        .video-card {
            margin-bottom: 20px;
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
        }
        .video-card video {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background: black;
        }
        .video-details {
            display: flex;
            gap: 12px;
            padding: 12px 15px;
        }
        .channel-avatar {
            width: 36px;
            height: 36px;
            background-color: #555;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .video-meta h3 {
            margin: 0 0 5px 0;
            font-size: 15px;
            line-height: 1.4;
        }
        .video-meta p {
            margin: 0;
            font-size: 13px;
            color: var(--secondary-text);
        }
        /* Shorts Grid */
        .shorts-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .short-card {
            background: #212121;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            height: 280px;
        }
        .short-card iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        /* Yuklash formasi */
        .upload-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }
        .upload-form input, .upload-form button {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #212121;
            color: white;
            font-size: 15px;
        }
        .upload-form button {
            background-color: var(--red-color);
            font-weight: bold;
            cursor: pointer;
        }
        .file-label {
            background: #272727;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            border: 1px dashed #555;
        }
        /* Profil dizayni */
        .profile-header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid #222;
        }
        .profile-avatar {
            width: 80px;
            height: 80px;
            background: var(--red-color);
            border-radius: 50%;
            margin: 0 auto 10px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
        }
        .subscribe-btn {
            background: white;
            color: black;
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .subscribe-btn.subscribed {
            background: #333;
            color: white;
        }
        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: #121212;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #272727;
            z-index: 1000;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--secondary-text);
            font-size: 11px;
            cursor: pointer;
            text-decoration: none;
            background: none;
            border: none;
        }
        .nav-item.active {
            color: white;
        }
        .nav-item span {
            font-size: 20px;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="logo">Uz<span>Tube</span></div>
        <div class="header-icons">
            <span onclick="alert('Qidiruv tizimi')">🔍</span>
            <span onclick="switchPage('profile')">👤</span>
        </div>
    </div>

    <!-- ASOSIY SAHIFA -->
    <div id="home-page" class="page active">
        <div class="chips-container">
            <button class="chip active">Barchasi</button>
            <button class="chip">O'yinlar</button>
            <button class="chip">Musiqa</button>
            <button class="chip">Futbol</button>
        </div>
        <div id="video-feed">
            <p style="text-align: center; color: var(--secondary-text); margin-top: 40px;">Hozircha videolar yo'k. 'Yuklash' bo'limidan video qo'shing!</p>
        </div>
    </div>

    <!-- SHORTS SAHIFASI -->
    <div id="shorts-page" class="page">
        <h2>⚡ Shorts Qisqa Videolar</h2>
        <div class="shorts-grid">
            <div class="short-card">
                <iframe src="https://www.youtube.com/embed/oz2oTmjmzgk" allowfullscreen></iframe>
            </div>
            <div class="short-card">
                <iframe src="https://www.youtube.com/embed/UO1sW2FsYiA" allowfullscreen></iframe>
            </div>
            <div class="short-card">
                <iframe src="https://www.youtube.com/embed/p-r0PbAMslc" allowfullscreen></iframe>
            </div>
            <div class="short-card">
                <iframe src="https://www.youtube.com/embed/E6kRWWu-HtU" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <!-- YUKLASH SAHIFASI -->
    <div id="upload-page" class="page">
        <h2>➕ Galereyadan Video Yuklash</h2>
        <div class="upload-form">
            <input type="text" id="v-title" placeholder="Video sarlavhasi (Nomi)">
            <input type="text" id="v-channel" placeholder="Kanal nomingiz (Nik)">
            <label class="file-label" id="file-label-text">📁 Galereyadan video tanlash
                <input type="file" id="v-file" accept="video/*" style="display: none;" onchange="handleFileSelect(this)">
            </label>
            <button onclick="uploadVideo()">Videoni Joylash</button>
        </div>
    </div>

    <!-- OBUNALAR SAHIFASI -->
    <div id="subscriptions-page" class="page">
        <h2>🔔 Obunalar</h2>
        <div id="subscriptions-list">
            <p style="color: var(--secondary-text);">Siz hali hech kimga obuna bo'lmadingiz.</p>
        </div>
    </div>

    <!-- PROFIL SAHIFASI -->
    <div id="profile-page" class="page">
        <div class="profile-header">
            <div class="profile-avatar" id="prof-initial">S</div>
            <h2 id="prof-name" style="margin: 5px 0;">Mening Kanalim</h2>
            <p id="prof-subs" style="color: var(--secondary-text); margin: 0; font-size: 14px;">0 obunachi</p>
            <button class="subscribe-btn" id="sub-action-btn" onclick="toggleSubscribe()">Obuna bo'lish</button>
        </div>
        <h3 style="margin-top: 20px;">Kanal videolari:</h3>
        <div id="profile-videos">
            <p style="color: var(--secondary-text);">Bu kanalda videolar yo'q.</p>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <button class="nav-item active" onclick="switchPage('home')"><span>🏠</span>Asosiy</button>
        <button class="nav-item" onclick="switchPage('shorts')"><span>⚡</span>Shorts</button>
        <button class="nav-item" onclick="switchPage('upload')"><span>➕</span>Yuklash</button>
        <button class="nav-item" onclick="switchPage('subscriptions')"><span>🔔</span>Obunalar</button>
        <button class="nav-item" onclick="switchPage('profile')"><span>👤</span>Siz</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let videos = [];
        let selectedVideoUrl = "";
        let isSubscribed = false;
        let subscriberCount = 0;

        function switchPage(pageName) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

            if (pageName === 'home') {
                document.getElementById('home-page').classList.add('active');
                event.currentTarget.classList.add('active');
            } else if (pageName === 'shorts') {
                document.getElementById('shorts-page').classList.add('active');
                event.currentTarget.classList.add('active');
            } else if (pageName === 'upload') {
                document.getElementById('upload-page').classList.add('active');
                event.currentTarget.classList.add('active');
            } else if (pageName === 'subscriptions') {
                document.getElementById('subscriptions-page').classList.add('active');
                event.currentTarget.classList.add('active');
            } else if (pageName === 'profile') {
                document.getElementById('profile-page').classList.add('active');
            }
        }

        function handleFileSelect(input) {
            if (input.files && input.files[0]) {
                let file = input.files[0];
                selectedVideoUrl = URL.createObjectURL(file);
                document.getElementById('file-label-text').innerText = "✅ Tanlandi: " + file.name;
            }
        }

        function uploadVideo() {
            let title = document.getElementById('v-title').value;
            let channel = document.getElementById('v-channel').value;

            if(!title || !channel || !selectedVideoUrl) {
                alert("Iltimos, video nomi, kanal niki va galereyadan videoni tanlang!");
                return;
            }

            let newVideo = {title: title, channel: channel, url: selectedVideoUrl, time: "Yangi"};
            videos.unshift(newVideo);

            // Profil ma'lumotlarini yangilash
            document.getElementById('prof-name').innerText = channel;
            document.getElementById('prof-initial').innerText = channel.charAt(0).toUpperCase();

            alert("Video muvaffaqiyatli joylandi!");
            
            // Formani tozalash
            document.getElementById('v-title').value = "";
            document.getElementById('v-channel').value = "";
            document.getElementById('file-label-text').innerText = "📁 Galereyadan video tanlash";
            selectedVideoUrl = "";

            renderFeed();
            renderProfileVideos();
            switchPage('home');
        }

        function renderFeed() {
            let feed = document.getElementById('video-feed');
            if (videos.length === 0) {
                feed.innerHTML = `<p style="text-align: center; color: var(--secondary-text); margin-top: 40px;">Hozircha videolar yo'k. 'Yuklash' bo'limidan video qo'shing!</p>`;
                return;
            }
            feed.innerHTML = "";
            videos.forEach(v => {
                feed.innerHTML += `
                    <div class="video-card">
                        <video controls src="${v.url}"></video>
                        <div class="video-details">
                            <div class="channel-avatar">${v.channel.charAt(0).toUpperCase()}</div>
                            <div class="video-meta">
                                <h3>${v.title}</h3>
                                <p>${v.channel} • ${v.time}</p>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function renderProfileVideos() {
            let pVideos = document.getElementById('profile-videos');
            if (videos.length === 0) {
                pVideos.innerHTML = `<p style="color: var(--secondary-text);">Bu kanalda videolar yo'q.</p>`;
                return;
            }
            pVideos.innerHTML = "";
            videos.forEach(v => {
                pVideos.innerHTML += `
                    <div class="video-card">
                        <video controls src="${v.url}"></video>
                        <div class="video-details">
                            <div class="video-meta">
                                <h3>${v.title}</h3>
                                <p>${v.time}</p>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function toggleSubscribe() {
            isSubscribed = !isSubscribed;
            let btn = document.getElementById('sub-action-btn');
            let subList = document.getElementById('subscriptions-list');
            let channelName = document.getElementById('prof-name').innerText;

            if (isSubscribed) {
                subscriberCount++;
                btn.innerText = "Obuna bo'lingan";
                btn.classList.add('subscribed');
                subList.innerHTML = `<div style="background:#212121; padding:10px; border-radius:8px; display:flex; justify-content:space-between; align-items:center;">
                    <span><b>${channelName}</b></span>
                    <span style="color:var(--secondary-text);">Obunadasiz</span>
                </div>`;
            } else {
                subscriberCount = Math.max(0, subscriberCount - 1);
                btn.innerText = "Obuna bo'lish";
                btn.classList.remove('subscribed');
                subList.innerHTML = `<p style="color: var(--secondary-text);">Siz hali hech kimga obuna bo'lmadingiz.</p>`;
            }
            document.getElementById('prof-subs').innerText = subscriberCount + " obunachi";
        }
    </script>
</body>
</html>
