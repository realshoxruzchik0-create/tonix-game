<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Shashka O'yini</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
        }
        .header {
            margin-bottom: 10px;
            font-size: 20px;
            font-weight: bold;
            color: #38bdf8;
            text-align: center;
        }
        .score-board {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            margin-bottom: 15px;
            font-size: 15px;
            background: #1e293b;
            padding: 10px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .board {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1 / 1;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            border: 5px solid #334155;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
        }
        .cell {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .light {
            background-color: #cbd5e1;
        }
        .dark {
            background-color: #334155;
        }
        .piece {
            width: 80%;
            height: 80%;
            border-radius: 50%;
            cursor: pointer;
            z-index: 2;
            box-shadow: 0 5px 10px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            transition: transform 0.1s;
        }
        .piece:active {
            transform: scale(0.92);
        }
        .white-piece {
            background: radial-gradient(circle at 30% 30%, #ffffff, #94a3b8);
            border: 3px solid #64748b;
            color: #0f172a;
        }
        .black-piece {
            background: radial-gradient(circle at 30% 30%, #475569, #0f172a);
            border: 3px solid #000000;
            color: #ffffff;
        }
        .king::after {
            content: '👑';
            font-size: 16px;
        }
        .selected {
            box-shadow: 0 0 0 4px #38bdf8, 0 5px 10px rgba(0,0,0,0.4);
        }
        .highlight::after {
            content: '';
            width: 18px;
            height: 18px;
            background-color: #38bdf8;
            border-radius: 50%;
            position: absolute;
            z-index: 3;
            cursor: pointer;
            box-shadow: 0 0 8px #38bdf8;
        }
        .status-msg {
            margin-top: 15px;
            font-size: 15px;
            color: #cbd5e1;
            font-weight: 500;
            text-align: center;
            min-height: 22px;
        }
        .btn-restart {
            margin-top: 15px;
            padding: 12px 24px;
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .btn-restart:active {
            background-color: #0ea5e9;
        }
    </style>
</head>
<body>

    <div class="header">👑 Shashka O'yini</div>
    
    <div class="score-board">
        <div>Siz (Oq): <span id="white-count">12</span></div>
        <div>Bot (Qora): <span id="black-count">12</span></div>
    </div>

    <div class="board" id="board"></div>

    <div class="status-msg" id="status">Sizning navbatingiz (Oq toshlar)</div>
    <button class="btn-restart" onclick="initGame()">Qaytadan boshlash</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let board = [];
        let turn = 'white'; // 'white' - o'yinchi, 'black' - bot
        let selectedPiece = null;
        let whiteCount = 12;
        let blackCount = 12;
        let gameOver = false;

        function initGame() {
            board = [];
            whiteCount = 12;
            blackCount = 12;
            turn = 'white';
            selectedPiece = null;
            gameOver = false;

            for (let r = 0; r < 8; r++) {
                board[r] = [];
                for (let c = 0; c < 8; c++) {
                    if ((r + c) % 2 === 1) {
                        if (r < 3) board[r][c] = { player: 'black', king: false };
                        else if (r > 4) board[r][c] = { player: 'white', king: false };
                        else board[r][c] = null;
                    } else {
                        board[r][c] = null;
                    }
                }
            }
            updateScore();
            renderBoard();
            document.getElementById('status').innerText = "Sizning navbatingiz (Oq toshlar)";
        }

        function renderBoard() {
            const boardElement = document.getElementById('board');
            boardElement.innerHTML = '';

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const cell = document.createElement('div');
                    cell.className = `cell ${(r + c) % 2 === 1 ? 'dark' : 'light'}`;

                    let pieceData = board[r][c];
                    if (pieceData) {
                        const piece = document.createElement('div');
                        piece.className = `piece ${pieceData.player === 'white' ? 'white-piece' : 'black-piece'} ${pieceData.king ? 'king' : ''}`;
                        
                        if (selectedPiece && selectedPiece.r === r && selectedPiece.col === c) {
                            piece.classList.add('selected');
                        }
                        
                        cell.appendChild(piece);
                    }

                    // Yurish mumkin bo'lgan nuqtalarni bosish
                    if (selectedPiece && selectedPiece.moves) {
                        let move = selectedPiece.moves.find(m => m.r === r && m.col === c);
                        if (move) {
                            cell.classList.add('highlight');
                            cell.onclick = () => makeMove(move);
                        }
                    }

                    // Oq toshlarni bosib tanlash (faqat o'yinchi navbatida)
                    if (pieceData && pieceData.player === 'white' && turn === 'white' && !gameOver) {
                        cell.onclick = () => selectPiece(r, c);
                    }

                    boardElement.appendChild(cell);
                }
            }
        }

        function selectPiece(r, c) {
            if (gameOver || turn !== 'white') return;
            selectedPiece = { r, col: c, moves: getValidMoves(r, c) };
            renderBoard();
        }

        function getValidMoves(r, c) {
            let piece = board[r][c];
            if (!piece) return [];
            let moves = [];
            let directions = piece.king ? [-1, 1] : (piece.player === 'white' ? [-1] : [1]);
            let colDirs = [-1, 1];

            directions.forEach(dr => {
                colDirs.forEach(dc => {
                    let nextR = r + dr;
                    let nextC = c + dc;

                    if (nextR >= 0 && nextR < 8 && nextC >= 0 && nextC < 8) {
                        if (!board[nextR][nextC]) {
                            moves.push({ r: nextR, col: nextC, type: 'move' });
                        } else if (board[nextR][nextC].player !== piece.player) {
                            let jumpR = nextR + dr;
                            let jumpC = nextC + dc;
                            if (jumpR >= 0 && jumpR < 8 && jumpC >= 0 && jumpC < 8 && !board[jumpR][jumpC]) {
                                moves.push({ r: jumpR, col: jumpC, type: 'jump', targetR: nextR, targetC: nextC });
                            }
                        }
                    }
                });
            });
            return moves;
        }

        function makeMove(move) {
            if (gameOver || turn !== 'white') return;
            let r = selectedPiece.r;
            let c = selectedPiece.col;
            let piece = board[r][c];

            board[move.r][move.col] = piece;
            board[r][c] = null;

            // Dambka bo'lishi
            if (piece.player === 'white' && move.r === 0) piece.king = true;

            if (move.type === 'jump') {
                board[move.targetR][move.targetC] = null;
                blackCount--;
            }

            selectedPiece = null;
            updateScore();
            renderBoard();

            if (blackCount === 0) {
                gameOver = true;
                document.getElementById('status').innerText = "🎉 Tabriklaymiz, Siz g'alaba qozondingiz!";
                return;
            }

            // Navbat botga o'tadi
            turn = 'black';
            document.getElementById('status').innerText = "🤖 Bot yurmoqda...";
            setTimeout(botMove, 700);
        }

        function botMove() {
            if (gameOver) return;
            let blackPieces = [];
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    if (board[r][c] && board[r][c].player === 'black') {
                        let moves = getValidMoves(r, c);
                        if (moves.length > 0) {
                            blackPieces.push({ r, c, moves });
                        }
                    }
                }
            }

            if (blackPieces.length > 0) {
                let jumpMoves = [];
                blackPieces.forEach(p => {
                    p.moves.forEach(m => {
                        if (m.type === 'jump') jumpMoves.push({ r: p.r, c: p.c, move: m });
                    });
                });

                let chosenPiece, chosenMove;
                if (jumpMoves.length > 0) {
                    let randJump = jumpMoves[Math.floor(Math.random() * jumpMoves.length)];
                    chosenPiece = { r: randJump.r, c: randJump.c };
                    chosenMove = randJump.move;
                } else {
                    let randomPieceObj = blackPieces[Math.floor(Math.random() * blackPieces.length)];
                    chosenPiece = { r: randomPieceObj.r, c: randomPieceObj.c };
                    chosenMove = randomPieceObj.moves[Math.floor(Math.random() * randomPieceObj.moves.length)];
                }

                let piece = board[chosenPiece.r][chosenPiece.c];
                board[chosenMove.r][chosenMove.col] = piece;
                board[chosenPiece.r][chosenPiece.c] = null;

                if (chosenMove.r === 7) piece.king = true;

                if (chosenMove.type === 'jump') {
                    board[chosenMove.targetR][chosenMove.targetC] = null;
                    whiteCount--;
                }
            }

            updateScore();
            renderBoard();

            if (whiteCount === 0) {
                gameOver = true;
                document.getElementById('status').innerText = "😔 Bot g'alaba qozondi!";
                return;
            }

            // Navbat yana o'yinchiga (sizga) qaytadi
            turn = 'white';
            selectedPiece = null;
            document.getElementById('status').innerText = "Sizning navbatingiz (Oq toshlar)";
        }

        function updateScore() {
            document.getElementById('white-count').innerText = whiteCount;
            document.getElementById('black-count').innerText = blackCount;
        }

        initGame();
    </script>
</body>
</html>
